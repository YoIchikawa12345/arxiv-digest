<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI論文まとめ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
:root {
  --bg:#fff;--bg2:#f7f8fa;--fg:#1a1a1a;--fg2:#555;--fg3:#888;
  --border:#e0e3e8;--accent:#3563e9;--accent-light:#e8eeff;--link:#3563e9;
}
@media (prefers-color-scheme:dark) {
  :root:not([data-theme=light]) {
    --bg:#0f1117;--bg2:#181c25;--fg:#e8eaf0;--fg2:#a0a8b8;--fg3:#6b7280;
    --border:#2a2f3e;--accent:#6b9aff;--accent-light:#1a2340;--link:#6b9aff;
    color-scheme:dark;
  }
}
:root[data-theme=dark] {
  --bg:#0f1117;--bg2:#181c25;--fg:#e8eaf0;--fg2:#a0a8b8;--fg3:#6b7280;
  --border:#2a2f3e;--accent:#6b9aff;--accent-light:#1a2340;--link:#6b9aff;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
body{
  background:var(--bg);color:var(--fg);
  font-family:'Noto Sans JP',sans-serif;font-size:15px;line-height:1.8;
  margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 64px;
}
.container{max-width:760px;margin:0 auto}
.site-header{padding-block:40px 24px;border-bottom:1px solid var(--border);margin-bottom:24px}
.site-header h1{margin:0 0 4px;font-size:24px;font-weight:700}
.site-header p{margin:0;font-size:13px;color:var(--fg3)}
.search-wrap{margin-bottom:16px}
#searchInput{
  width:100%;padding:10px 14px;font-size:15px;
  border:1px solid var(--border);border-radius:8px;
  background:var(--bg2);color:var(--fg);outline:none;font-family:inherit;
}
#searchInput:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-light)}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
.tab{
  padding:6px 14px;border-radius:20px;border:1px solid var(--border);
  background:var(--bg2);color:var(--fg2);font-size:13px;font-weight:500;
  cursor:pointer;font-family:inherit;transition:background .15s,color .15s;
}
.tab:hover,.tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.top-bar{
  display:flex;justify-content:space-between;align-items:center;
  flex-wrap:wrap;gap:8px;margin-bottom:12px;font-size:13px;color:var(--fg3);
}
.top-bar strong{color:var(--fg)}
.pagination{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.page-btn{
  min-width:36px;height:36px;padding:0 10px;border-radius:6px;
  border:1px solid var(--border);background:var(--bg2);color:var(--fg2);
  font-size:13px;cursor:pointer;font-family:inherit;
}
.page-btn:hover,.page-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.bottom-bar{display:flex;justify-content:flex-end;margin-top:20px}
.card{border:1px solid var(--border);border-radius:10px;padding:20px 24px;margin-bottom:16px;background:var(--bg)}
.card-meta{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--fg3);margin-bottom:8px}
.date{color:var(--accent);font-weight:700}
.card-cat{background:var(--accent-light);color:var(--accent);padding:1px 8px;border-radius:20px;font-size:11px;font-weight:700}
.card-title{margin:0 0 10px;font-size:16px;font-weight:700;line-height:1.4}
.card-title a{color:var(--link);text-decoration:none}
.card-title a:hover{text-decoration:underline}
.card-summary{margin:0;font-size:14px;color:var(--fg2);line-height:1.7}
.card-terms{margin-top:12px;padding-top:12px;border-top:1px dashed var(--border)}
.card-terms-label{font-size:11px;font-weight:700;color:var(--fg3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
.card-terms dl{margin:0;display:flex;flex-direction:column;gap:3px}
.card-terms dt{font-size:12px;font-weight:700;color:var(--accent);display:inline}
.card-terms dd{font-size:12px;color:var(--fg2);margin:0;display:inline}
.card-formulas{margin-top:12px;padding-top:12px;border-top:1px dashed var(--border)}
.card-formulas-label{font-size:11px;font-weight:700;color:var(--fg3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
.formula-item{margin-bottom:6px}
.formula-expr{font-size:12px;font-family:monospace;color:var(--accent);font-weight:700;display:block;margin-bottom:2px}
.formula-meaning{font-size:12px;color:var(--fg2)}
.no-results{text-align:center;padding:64px 0;color:var(--fg3)}
.loading{text-align:center;padding:40px 0;color:var(--fg3)}
.sort-bar{display:flex;gap:8px;align-items:center;margin-bottom:12px;font-size:13px;color:var(--fg3)}
.sort-btn{
  padding:5px 12px;border-radius:20px;border:1px solid var(--border);
  background:var(--bg2);color:var(--fg2);font-size:12px;font-weight:500;
  cursor:pointer;font-family:inherit;transition:background .15s,color .15s;
}
.sort-btn:hover,.sort-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.read-filter-bar{display:flex;gap:8px;align-items:center;margin-bottom:12px;font-size:13px;color:var(--fg3)}
.read-filter-btn{
  padding:5px 12px;border-radius:20px;border:1px solid var(--border);
  background:var(--bg2);color:var(--fg2);font-size:12px;font-weight:500;
  cursor:pointer;font-family:inherit;transition:background .15s,color .15s;
}
.read-filter-btn:hover,.read-filter-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.card.is-read{opacity:0.6}
.card.is-read .card-title a{text-decoration:line-through}
.read-check-wrap{display:flex;align-items:center;gap:6px;margin-top:10px;padding-top:10px;border-top:1px solid var(--border)}
.read-check{width:16px;height:16px;cursor:pointer;accent-color:var(--accent)}
.read-check-label{font-size:12px;color:var(--fg3);cursor:pointer;user-select:none}
</style>
</head>
<body>
<div class="container">
  <header class="site-header">
    <h1>AI論文まとめ</h1>
    <p>arXivの最新AI・機械学習論文の日本語要約集 &nbsp;·&nbsp; 全 60 件 &nbsp;·&nbsp; 最終更新 2026-10-24 21:20 JST</p>
  </header>
  <div class="search-wrap">
    <input type="search" id="searchInput" placeholder="タイトル・要約を検索…" autocomplete="off">
  </div>
  <div class="tabs" role="tablist">
    <button class="tab active" onclick="setTab(this,'all')">すべて</button>
    <button class="tab" onclick="setTab(this,'cs.AI')">🤖 AI・推論</button>
    <button class="tab" onclick="setTab(this,'cs.LG')">📊 機械学習</button>
    <button class="tab" onclick="setTab(this,'cs.CL')">💬 自然言語処理</button>
    <button class="tab" onclick="setTab(this,'cs.CV')">🖼 画像・Vision</button>
  </div>
  <div class="sort-bar">
    <span>並び替え:</span>
    <button class="sort-btn active" onclick="setSort(this,'date')">🆕 新しい順</button>
    <button class="sort-btn" onclick="setSort(this,'cite')">📈 引用が多い順</button>
  </div>
  <div class="read-filter-bar">
    <span>閲覧状態:</span>
    <button class="read-filter-btn active" onclick="setReadFilter(this,'all')">すべて</button>
    <button class="read-filter-btn" onclick="setReadFilter(this,'read')">✅ 読了済み</button>
    <button class="read-filter-btn" onclick="setReadFilter(this,'unread')">📄 未読</button>
  </div>
  <div class="top-bar">
    <span id="statsText"></span>
    <div class="pagination" id="paginTop"></div>
  </div>
  <div id="cards"><div class="loading">読み込み中…</div></div>
  <div class="bottom-bar">
    <div class="pagination" id="paginBottom"></div>
  </div>
</div>
<script>
(function() {
  var PER_PAGE = 10, page = 1, cat = 'all', q = '', sortOrder = 'date', readFilter = 'all', PAPERS = [];
  var readPapers = (function() {
    try { return new Set(JSON.parse(localStorage.getItem('arxiv_read') || '[]')); }
    catch(e) { return new Set(); }
  })();
  function saveRead() {
    try { localStorage.setItem('arxiv_read', JSON.stringify(Array.from(readPapers))); } catch(e) {}
  }
  var CAT_LABELS = {'cs.AI':'AI・推論','cs.LG':'機械学習','cs.CL':'自然言語処理','cs.CV':'画像・Vision'};
  function getCat(p) {
    var c = (p.categories || [])[0];
    if (c) return c;
    var t = ((p.title||'') + ' ' + (p.summary||'')).toLowerCase();
    if (/language model|llm|nlp|translation|tokeniz|speech|chat|dialogue|prompt/.test(t)) return 'cs.CL';
    if (/image|vision|visual|pixel|video|3d|segmentation|detection|recognition|diffusion/.test(t)) return 'cs.CV';
    if (/reinforcement|reward|policy|agent|planning|reasoning|logic|knowledge/.test(t)) return 'cs.AI';
    return 'cs.LG';
  }
  function esc(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
  function filtered() {
    return PAPERS.filter(function(p) {
      if (cat !== 'all' && getCat(p) !== cat) return false;
      if (q && ((p.title||'') + ' ' + (p.summary||'')).toLowerCase().indexOf(q) < 0) return false;
      var isRead = readPapers.has(p.paperId||'');
      if (readFilter === 'read' && !isRead) return false;
      if (readFilter === 'unread' && isRead) return false;
      return true;
    });
  }
  function sorted(arr) {
    var a = arr.slice();
    if (sortOrder === 'cite') {
      a.sort(function(x, y) { return (y.citationCount||0) - (x.citationCount||0); });
    } else {
      a.sort(function(x, y) {
        var da = x.addedDate||x.published||'', db = y.addedDate||y.published||'';
        return db > da ? 1 : db < da ? -1 : 0;
      });
    }
    return a;
  }
  function renderPagin(total, id) {
    var el = document.getElementById(id);
    var pages = Math.ceil(total / PER_PAGE);
    if (pages <= 1) { el.innerHTML = ''; return; }
    var h = '';
    if (page > 1) h += '<button class="page-btn" onclick="go(' + (page-1) + ')">← 前へ</button>';
    for (var i = 1; i <= pages; i++) {
      if (i === 1 || i === pages || Math.abs(i-page) <= 2)
        h += '<button class="page-btn' + (i===page?' active':'') + '" onclick="go(' + i + ')">' + i + '</button>';
      else if (Math.abs(i-page) === 3)
        h += '<span style="color:var(--fg3);padding:0 4px">…</span>';
    }
    if (page < pages) h += '<button class="page-btn" onclick="go(' + (page+1) + ')">次へ →</button>';
    el.innerHTML = h;
  }
  function render() {
    var f = sorted(filtered()), total = f.length;
    var slice = f.slice((page-1)*PER_PAGE, page*PER_PAGE);
    document.getElementById('statsText').innerHTML =
      '<strong>' + total + '</strong> 件 / 全 <strong>' + PAPERS.length + '</strong> 件';
    renderPagin(total,'paginTop');
    renderPagin(total,'paginBottom');
    if (!slice.length) {
      document.getElementById('cards').innerHTML = '<div class="no-results">該当する論文が見つかりませんでした。</div>';
      return;
    }
    var html = '';
    for (var j = 0; j < slice.length; j++) {
      var p = slice[j], c = getCat(p), label = CAT_LABELS[c] || c;
      var terms = p.terms || {}, termKeys = Object.keys(terms), termsHtml = '';
      if (termKeys.length) {
        termsHtml = '<div class="card-terms"><div class="card-terms-label">📖 用語解説</div><dl>' +
          termKeys.map(function(k) { return '<dt>' + esc(k) + '</dt><dd>: ' + esc(terms[k]) + '</dd>'; }).join('') +
          '</dl></div>';
      }
      var formulas = p.formulas || [], formulasHtml = '';
      if (formulas.length) {
        formulasHtml = '<div class="card-formulas"><div class="card-formulas-label">📐 数式解説</div>' +
          formulas.map(function(f) {
            return '<div class="formula-item"><span class="formula-expr">' + esc(f.expression||'') + '</span>' +
              '<span class="formula-meaning">' + esc(f.meaning||'') + '</span></div>';
          }).join('') + '</div>';
      }
      var pid = p.paperId || '';
      var isRead = pid && readPapers.has(pid);
      var chkId = 'chk_' + pid.replace(/[^a-zA-Z0-9]/g,'_');
      var readCheckHtml = '<div class="read-check-wrap">' +
        '<input type="checkbox" class="read-check" id="' + chkId + '"' +
        (isRead ? ' checked' : '') +
        (pid ? ' onchange="toggleRead('' + pid + '',this)"' : ' disabled') + '>' +
        '<label class="read-check-label" for="' + chkId + '">読了済みにする</label>' +
        '</div>';
      html += '<article class="card' + (isRead ? ' is-read' : '') + '">' +
        '<div class="card-meta">' +
        '<span class="date">📅 ' + esc(p.published||p.year||'') + '</span>' +
        '<span class="card-cat">' + label + '</span>' +
        '<span>追加: ' + esc(p.addedDate||'') + '</span>' +
        '</div>' +
        '<h2 class="card-title"><a href="' + esc(p.url||'#') + '" target="_blank" rel="noopener">' + esc(p.title||'') + '</a></h2>' +
        '<p class="card-summary">' + esc(p.summary||'（要約なし）') + '</p>' +
        termsHtml +
        formulasHtml +
        readCheckHtml +
        '</article>';
    }
    document.getElementById('cards').innerHTML = html;
  }
  window.go = function(n) { page = n; render(); window.scrollTo(0,0); };
  window.setSort = function(btn, s) {
    document.querySelectorAll('.sort-btn').forEach(function(t) { t.classList.remove('active'); });
    btn.classList.add('active');
    sortOrder = s; page = 1; render();
  };
  window.setReadFilter = function(btn, f) {
    document.querySelectorAll('.read-filter-btn').forEach(function(t) { t.classList.remove('active'); });
    btn.classList.add('active');
    readFilter = f; page = 1; render();
  };
  window.toggleRead = function(paperId, cb) {
    if (cb.checked) {
      readPapers.add(paperId);
    } else {
      readPapers.delete(paperId);
    }
    saveRead();
    var card = cb.closest('.card');
    if (card) {
      if (cb.checked) { card.classList.add('is-read'); } else { card.classList.remove('is-read'); }
    }
    if (readFilter !== 'all') { page = 1; render(); }
  };
  window.setTab = function(btn, c) {
    document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
    btn.classList.add('active');
    cat = c; page = 1; render();
  };
  document.getElementById('searchInput').addEventListener('input', function(e) {
    q = e.target.value.toLowerCase().trim(); page = 1; render();
  });
  PAPERS = [{"paperId": "2c03df8b48bf3fa39054345bafabfeff15bfd11d", "arxivId": "1512.03385", "title": "Deep Residual Learning for Image Recognition", "year": 2015, "published": "2015", "categories": [], "citationCount": 243109, "influentialCitationCount": 33150, "url": "https://arxiv.org/abs/1512.03385", "summary": "AIが画像を認識する際、層を何十層も深く重ねるほど賢くなると期待されていましたが、実際には深すぎると学習がうまく進まなくなる問題がありました。この論文では、入力をそのまま次の層へ飛び越えて足し合わせる「スキップ接続」という仕組みを取り入れた「残差ネットワーク（ResNet）」を提案しました。層の出力そのものをゼロから学習するのではなく、入力との差分（残差）だけを学習することで、信号が奥の層までスムーズに届くようになります。この工夫により、従来の限界を大幅に超える100層以上の非常に深いネットワークでも安定して学習できるようになりました。その結果、画像認識コンペティションで誤り率を大幅に低下させ、複雑な画像でも正確に見分けられる性能を達成しました。", "terms": {"残差学習": "ゼロからすべてを覚え直すのではなく、元の入力情報と目標の出力情報との「差額（ズレ）」だけを学ぶ仕組みです。", "スキップ接続": "途中の処理を飛ばして、手前の層のデータをそのまま奥の層に足し合わせるバイパスのような経路のことです。", "勾配消失問題": "ネットワークが深くなりすぎると、学習のための修正指示（勾配）が途中で弱まり、入り口付近の層が学習できなくなる現象です。"}, "formulas": [{"expression": "\\mathbf{y} = \\mathcal{F}(\\mathbf{x}, \\{W_i\\}) + \\mathbf{x}", "meaning": "入力 $\\mathbf{x}$ に対し、層で学習した変化分 $\\mathcal{F}$ を計算したあと、元の入力 $\\mathbf{x}$ をそのまま足して最終出力 $\\mathbf{y}$ とする計算式です。"}, {"expression": "\\mathcal{F} = W_2 \\sigma(W_1 \\mathbf{x})", "meaning": "入力データに対して2回の重み付け変換と活性化関数 $\\sigma$ を行い、差分となる特徴を抽出する処理を表しています。"}], "addedDate": "2026-10-24"}, {"paperId": "eb42cf88027de515750f230b23b1a057dc782108", "arxivId": "1409.1556", "title": "Very Deep Convolutional Networks for Large-Scale Image Recognition", "year": 2014, "published": "2014", "categories": [], "citationCount": 115096, "influentialCitationCount": 14721, "url": "https://arxiv.org/abs/1409.1556", "summary": "コンピュータに写真の内容を理解させる畳み込みニューラルネットワーク（CNN）において、層の深さが認識性能にどれほど影響を与えるかは明確ではありませんでした。研究チームは、従来使われていた大きな受容野ではなく、$3\\times 3$ というごく小さな正方形のフィルターを一貫して積み重ねる手法を試しました。小さなフィルターを何枚も重ねることで、計算量を抑えつつ、広い範囲を見渡す大きなフィルターと同じ効果を得られるようにしています。この方針でネットワークの深さを16層から19層まで増やした「VGG」と呼ばれるモデルを開発しました。実験の結果、層を深くするほど画像の細かな模様から全体像までを段階的に捉えられるようになり、画像分類の正解率が大きく向上しました。", "terms": {"畳み込みフィルター": "画像の上をマス目状に滑らせながら、輪郭や色合いなどの特徴を拾い出す小さな計算窓のことです。", "層の深さ": "画像から特徴を抽出して判断を下すまでに、計算を何段階積み重ねているかを表す回数のことです。", "プーリング": "画像の特徴を保ったまま画像サイズを縮小し、計算量を減らして位置のズレに強くする処理です。"}, "formulas": [{"expression": "3 \\times 3", "meaning": "画像から特徴を取り出すフィルターの縦横のサイズであり、上下左右の中心を特定できる最小の正方形サイズを示しています。"}, {"expression": "D = 16 \\text{ or } 19", "meaning": "VGGモデルで重み（学習すべきパラメータ）を持つ畳み込み層と全結合層の合計の深さ（層数）を表しています。"}], "addedDate": "2026-10-24"}, {"paperId": "268d347e8a55b5eb82fb5e7d2f800e33c75ab18a", "arxivId": "2010.11929", "title": "An Image is Worth 16x16 Words: Transformers for Image Recognition at Scale", "year": 2020, "published": "2020", "categories": [], "citationCount": 72293, "influentialCitationCount": 7661, "url": "https://arxiv.org/abs/2010.11929", "summary": "文章の翻訳などで高い成果を出していた「Transformer」という仕組みは、画像の処理では補助的な役割にとどまっていました。この研究では、画像分野で定番だった畳み込み処理を使わず、Transformerだけで画像を分類する手法「Vision Transformer（ViT）」を提案しました。この手法では、1枚の画像を $16\\times 16$ ピクセルなどの小さな正方形のパッチに細かく切り分け、それらを文章の単語のように並べて扱います。パッチ同士が画像全体のどこに関連しているかを同時に見比べながら、重要な部分に自動で注目して理解を深めます。大量の画像データを使って事前学習を行うことで、従来の画像認識モデルと同等以上の高い認識精度を出すことに成功しました。", "terms": {"画像パッチ": "1枚の画像をモザイクのように均等な正方形で小さく切り分けた、1つひとつの画像片のことです。", "自己注意機構": "データのどの部分同士が強く関係しているかを、文脈や全体像に合わせて重み付けして見極める仕組みです。", "事前学習": "特定の目的を決める前に、膨大なデータを使って一般的な特徴や知識をあらかじめ学ばせておく準備段階のことです。"}, "formulas": [{"expression": "\\mathbf{z}_0 = [\\mathbf{x}_{\\text{class}}; \\mathbf{x}_p^1 \\mathbf{E}; \\dots; \\mathbf{x}_p^N \\mathbf{E}] + \\mathbf{E}_{\\text{pos}}", "meaning": "切り分けた画像パッチ $\\mathbf{x}_p$ を数値列に変換し、位置情報 $\\mathbf{E}_{\\text{pos}}$ と分類専用の記号 $\\mathbf{x}_{\\text{class}}$ を足し合わせてモデルの入力とする式です。"}, {"expression": "N = HW / P^2", "meaning": "画像の縦 $H$ と横 $W$ をパッチのサイズ $P$ で割り算し、画像全体がいくつのパッチ $N$ に分割されるかを計算する式です。"}], "addedDate": "2026-10-24"}, {"paperId": "7aa38b85fa8cba64d6a4010543f6695dbf5f1386", "arxivId": "1706.06083", "title": "Towards Deep Learning Models Resistant to Adversarial Attacks", "year": 2017, "published": "2017", "categories": [], "citationCount": 15922, "influentialCitationCount": 4015, "url": "https://arxiv.org/abs/1706.06083", "summary": "画像認識AIは、人間には気づけないほどわずかなノイズを画像に加えられるだけで、誤った判定をしてしまう脆さを持っています。この論文では、そうした騙し画像（敵対的サンプル）に対抗し、安全で頑丈なAIモデルを作るための統一的な枠組みを研究しました。問題の核心を「攻撃側はモデルの誤りを最大化するノイズを探し、防御側はその最悪のノイズが加わっても正解できるように学習する」という一種のゲームとして捉え直しました。最強の攻撃手法として「PGD攻撃」を定義し、その攻撃によって作られた画像を学習データに混ぜて訓練する手法を確立しました。この学習を行うことで、未知の巧妙な騙し攻撃に対しても簡単には惑わされない頑健なモデルが作れることを実証しました。", "terms": {"敵対的サンプル": "人間には元のデータと区別がつかないが、AIを意図的に誤認させる細工が加えられたデータのことです。", "敵対的訓練": "学習の段階でAIを騙すような細工データをわざと生成し、それを正しく見破る練習を繰り返す防御手法です。", "摂動": "元データに対して加えられる、目に見えないほどわずかなノイズやズレのことです。"}, "formulas": [{"expression": "\\min_\\theta \\mathbb{E}_{(x, y) \\sim \\mathcal{D}} \\left[ \\max_{\\delta \\in S} L(\\theta, x + \\delta, y) \\right]", "meaning": "許されたノイズ $\\delta$ の範囲内でAIの誤りを最大化（攻撃）し、その状態でも損失 $L$ が最小になるようパラメータ $\\theta$ を更新（防御）する目標式です。"}, {"expression": "x^{t+1} = \\Pi_{x + S} \\left( x^t + \\alpha \\,\\mathrm{sgn}(\\nabla_x L(\\theta, x^t, y)) \\right)", "meaning": "画像の勾配の向きに沿って少しずつノイズを足していき、制限範囲 $S$ 内に収まるよう投影しながら強力な攻撃画像を反復生成する計算式です。"}], "addedDate": "2026-10-24"}, {"paperId": "2e62d1345b340d5fda3b092c460264b9543bc4b5", "arxivId": "", "title": "Genetic Algorithms in Search Optimization and Machine Learning", "year": 1988, "published": "1988", "categories": [], "citationCount": 61614, "influentialCitationCount": 3603, "url": "https://www.semanticscholar.org/paper/2e62d1345b340d5fda3b092c460264b9543bc4b5", "summary": "複雑な問題から最も良い答えを探し出す際、条件が多すぎると従来の計算手法では解を見つけることが困難になります。この研究書は、生物の進化や自然淘汰の仕組みをコンピュータの探索や機械学習に応用する「遺伝的アルゴリズム（GA）」の基本体系を解説しています。候補となる解を「生物の遺伝子」に見立て、多数の解の集まり（個体群）をコンピュータ内で世代交代させていきます。成績の良い解を残す「選択」、2つの解の情報を混ぜ合わせる「交叉」、確率で突然変異を起こす「変異」という3つの操作を繰り返します。これにより、局所的な罠に捕まることなく、広大な探索空間から実用的な最適解を効率よく見つけ出す仕組みを確立しました。", "terms": {"遺伝子型": "解の候補を0と1の並びや記号の配列としてコンピュータ上に表現したデータのことです。", "適応度": "ある解が問題の条件をどれくらい満たしているか、優秀さを数値化した点数のことです。", "交叉": "親となる2つの優れた解を途中で切り離してつなぎ合わせ、新しい子供の解を作る操作です。"}, "formulas": [{"expression": "P(i) = \\frac{f_i}{\\sum_{j=1}^N f_j}", "meaning": "個体 $i$ の適応度 $f_i$ を全体の合計で割ることで、優秀な個体ほど次の世代に選ばれやすくなる確率を計算する式です。"}, {"expression": "m(H, t+1) \\ge m(H, t) \\frac{f(H)}{\\bar{f}} [1 - p_c \\dots - p_m \\dots]", "meaning": "優れた特徴パターン（スキーマ $H$）を持つ解が、世代 $t$ を経るごとに集団内で指数関数的に増えていく様子を示すスキーマ定理の式です。"}], "addedDate": "2026-10-24"}, {"paperId": "a8ca46b171467ceb2d7652fbfb67fe701ad86092", "arxivId": "2106.09685", "title": "LoRA: Low-Rank Adaptation of Large Language Models", "year": 2021, "published": "2021", "categories": [], "citationCount": 24779, "influentialCitationCount": 3436, "url": "https://arxiv.org/abs/2106.09685", "summary": "近年の巨大な言語モデルは非常に賢い反面、特定の用途に合わせて調整（ファインチューニング）しようとすると、莫大な計算コストと保存容量が必要になります。この論文では、元のモデルの重みを一切変更せずに凍結し、追加の小さなパーツだけを学習させる「LoRA（低ランク適応）」を提案しました。モデル内の巨大な行列の更新幅を、細長い2つの小さな行列の掛け算に分解して表現することで、学習が必要なパラメータ数を数万分の一に削減します。推論時には、学習した小さな行列の積を元の重みに足し戻すだけでよいため、処理速度が遅くなることもありません。これにより、一般のパソコンに近い環境でも、巨大言語モデルを効率的かつ高精度にカスタマイズできるようになりました。", "terms": {"ファインチューニング": "すでに学習を終えた汎用的なモデルに対し、特定のタスク用データを追加で学ばせて専門性を高める作業です。", "パラメータ": "AIモデルが予測を行うために内部で保持している、学習によって調整される数値（重み）のことです。", "低ランク行列分解": "巨大な表（行列）を、情報の特徴を凝縮した細長い2つの小さな表の掛け算に近似して表現する数学的な手法です。"}, "formulas": [{"expression": "h = W_0 x + \\Delta W x = W_0 x + \\frac{\\alpha}{r} B A x", "meaning": "元の固定された重み $W_0$ による計算に、低ランクに分解した2つの小さな行列 $B$ と $A$ による変化分を足し合わせて出力を得る計算式です。"}, {"expression": "\\Delta W = B A, \\quad B \\in \\mathbb{R}^{d \\times r}, A \\in \\mathbb{R}^{r \\times k} \\quad (r \\ll \\min(d, k))", "meaning": "大きな変化幅 $\\Delta W$ を、ごく小さな内部次元 $r$ を持つ2つの行列の積として表現することを表しています。"}], "addedDate": "2026-10-24"}, {"paperId": "d997beefc0922d97202789d2ac307c55c2c52fba", "arxivId": "1612.00593", "title": "PointNet: Deep Learning on Point Sets for 3D Classification and Segmentation", "year": 2016, "published": "2016", "categories": [], "citationCount": 18867, "influentialCitationCount": 3343, "url": "https://arxiv.org/abs/1612.00593", "summary": "自動運転のセンサーなどで得られる3次元データは「点群」と呼ばれ、空間上に散らばる不規則な点の集まりとして記録されます。従来の深層学習モデルは規則正しいマス目状のデータを好むため、点群を一度3次元グリッドや2D画像に変換して処理していましたが、計算量が膨大になる欠点がありました。PointNetは、点の並び順が入れ替わっても結果が変わらない性質（対称性）を保ちながら、生の3次元座標を直接入力して処理するネットワークです。各点ごとに独立して特徴を抽出したあと、「最大値プーリング」という操作で点群全体を代表する1つの特徴ベクトルをまとめ上げます。この工夫により、物体の向きのズレに強く、3D物体の分類や各パーツの切り分け（セグメンテーション）を高速かつ高精度に行えるようになりました。", "terms": {"点群": "物体の表面をレーザーなどで計測した、3次元空間上の無数の点 $(x, y, z)$ の集まりのことです。", "置換不変性": "入力されるデータの並び順がランダムに入れ替わっても、AIの出力結果が変化しない性質のことです。", "セグメンテーション": "データ内のどの部分がテーブルの脚や飛行機の翼であるかなど、構成パーツごとに細かくラベル付けする作業です。"}, "formulas": [{"expression": "f(\\{x_1, \\dots, x_n\\}) \\approx g(h(x_1), \\dots, h(x_n))", "meaning": "各点 $x_i$ を関数 $h$ で別々に処理したあと、順序に依存しない共通関数 $g$（最大値プーリングなど）で集約する基本構造を表しています。"}, {"expression": "g = \\max_{i=1,\\dots,n}", "meaning": "全点の特徴量の中から各次元の最大値を取り出すことで、点の入力順序がどう変わっても同一の全体特徴を得る操作です。"}], "addedDate": "2026-10-24"}, {"paperId": "024006d4c2a89f7acacc6e4438d156525b60a98f", "arxivId": "1509.02971", "title": "Continuous control with deep reinforcement learning", "year": 2015, "published": "2015", "categories": [], "citationCount": 16273, "influentialCitationCount": 2254, "url": "https://arxiv.org/abs/1509.02971", "summary": "ゲームの画面操作などを自ら試行錯誤して学ぶ強化学習は成果を上げていましたが、「右にハンドルを32.5度切る」といった無段階で滑らかな動作（連続値制御）の学習は苦手でした。この研究では、行動を決める役（Actor）と、その行動の良し悪しを評価する役（Critic）にAIを分ける「DDPG」という手法を提案しました。物理シミュレータ上で車を運転させたり、ロボットの関節を滑らかに動かしたりするような連続的な操作を直接学習できます。過去の行動履歴を記憶庫に保存してランダムに取り出し再利用する技術や、学習のブレを抑える目標ネットワークを組み込みました。これにより、車台の上で棒をバランス良く立たせる制御や歩行運動など、20種類以上の複雑な物理タスクを安定して習得できるようになりました。", "terms": {"強化学習": "AIが環境の中で自ら行動を起こし、成功に応じた「報酬」を最大化するように試行錯誤を繰り返して上達する学習法です。", "連続アクション空間": "「ボタンを押す／押さない」といった離散的な選択ではなく、アクセル開度や角度のように連続した数値で指示を出す動作領域のことです。", "経験再生": "過去に体験した「状態・行動・報酬」の組み合わせをメモリに保存しておき、シャッフルして学習に使うことで偏りを防ぐ手法です。"}, "formulas": [{"expression": "Q(s, a) = \\mathbb{E} \\left[ r(s, a) + \\gamma Q(s', \\mu(s')) \\right]", "meaning": "現在の状態 $s$ で行動 $a$ を取ったときの価値 $Q$ は、即座にもらえる報酬 $r$ と、次の状態 $s'$ での方針 $\\mu$ による将来の期待価値の合計になるという式です。"}, {"expression": "\\nabla_{\\theta^\\mu} J \\approx \\mathbb{E} \\left[ \\nabla_a Q(s, a|\\theta^Q)|_{a=\\mu(s)} \\nabla_{\\theta^\\mu} \\mu(s|\\theta^\\mu) \\right]", "meaning": "行動の価値を高めるために、評価役（Critic）の評価が良くなる方向へと行動役（Actor）のパラメータ $\\theta^\\mu$ を更新する勾配計算式です。"}], "addedDate": "2026-10-24"}, {"paperId": "6351ebb4a3287f5f3e1273464b3b91e5df5a16d7", "arxivId": "2111.06377", "title": "Masked Autoencoders Are Scalable Vision Learners", "year": 2021, "published": "2021", "categories": [], "citationCount": 13299, "influentialCitationCount": 2168, "url": "https://arxiv.org/abs/2111.06377", "summary": "文章モデルでは「文章の一部を穴埋め問題にして解かせる」手法で高い効果が出ていましたが、画像では画素同士の情報が似通っているため同様の手法は難しいと考えられていました。この研究では、画像をパッチに切り分けたあと、そのうち約75％という大部分を黒塗りに隠して残りの部分を復元させる「Masked Autoencoder（MAE）」を開発しました。見える部分（25％）のパッチだけを計算量の重いエンコーダで処理し、隠された部分には軽いデコーダを使って元のピクセルを再構築させます。無駄な計算を大幅に省けるため、非常に大きな画像認識モデルでも高速かつ効率的に学習を進めることが可能になりました。この穴埋め学習を終えたモデルは、画像全体の構造や物体の概念をしっかりと捉えられるようになり、様々な画像タスクで高い精度を発揮しました。", "terms": {"自己教師あり学習": "人間が正解ラベル（答え）を1枚ずつ手作業でつけなくても、データ自身の一部を隠して予測させることで自律的に賢くなる学習法です。", "エンコーダ": "入力データから本質的な特徴をギュッと圧縮して取り出す変換役のネットワークです。", "デコーダ": "圧縮された特徴や限られた手がかりをもとにして、元の完全な画像データを復元する復号役のネットワークです。"}, "formulas": [{"expression": "\\text{Mask Ratio} \\approx 75\\%", "meaning": "入力画像のパッチのうち約4分の3を覆い隠し、冗長な情報を減らして難度の高い復元タスクを課す設定比率です。"}, {"expression": "L = \\frac{1}{|M|} \\sum_{i \\in M} |x_i - \\hat{x}_i|^2", "meaning": "マスクで隠された領域 $M$ についてのみ、元のピクセル値 $x_i$ と復元された値 $\\hat{x}_i$ の二乗誤差を計算して学習の指針とする損失関数です。"}], "addedDate": "2026-10-24"}, {"paperId": "811df72e210e20de99719539505da54762a11c6d", "arxivId": "1801.01290", "title": "Soft Actor-Critic: Off-Policy Maximum Entropy Deep Reinforcement Learning with a Stochastic Actor", "year": 2018, "published": "2018", "categories": [], "citationCount": 12792, "influentialCitationCount": 2161, "url": "https://arxiv.org/abs/1801.01290", "summary": "ロボットなどの複雑な制御を深層強化学習で解こうとすると、学習が不安定で失敗しやすかったり、膨大な試行回数が必要になったりする課題がありました。この論文では、目標を達成して高い点数を得るだけでなく、「できるだけ予測のつかない多様な行動を保つ（エントロピーを最大化する）」ことを目指す「Soft Actor-Critic（SAC）」を提案しました。1つの最適行動だけに過剰に固執せず、様々な動きをバランスよく試すようになるため、予期せぬ落とし穴を避けながら安定して学習が進みます。また、過去に得たすべての経験データを無駄なく再利用できる仕組みを備えています。このアプローチにより、手動での細かなパラメータ調整を減らしつつ、ロボットの脚による歩行など高度なタスクを素早くスムーズに習得できるようになりました。", "terms": {"エントロピー": "行動の「予測のつきにくさ」や「ばらつき具合（多様性）」を表す尺度で、値が大きいほど様々な選択肢を試している状態を意味します。", "オフポリシー": "現在学習中の最新の行動方針だけでなく、過去に試した異なる方針から得られた古い経験データも捨てずに再利用できる学習の形式です。", "確率的方策": "ある状況で常に同じ行動を1つだけ選ぶのではなく、「行動Aを70％、行動Bを30％」のように確率の幅を持たせて選択する方針のことです。"}, "formulas": [{"expression": "J(\\pi) = \\sum_{t=0}^T \\mathbb{E}_{(s_t, a_t)} \\left[ r(s_t, a_t) + \\alpha \\mathcal{H}(\\pi(\\cdot|s_t)) \\right]", "meaning": "将来得られる報酬の合計 $r$ に加え、方策の多様性を表すエントロピー $\\mathcal{H}$ に係数 $\\alpha$ を掛けた値を最大化する目的関数です。"}, {"expression": "\\mathcal{H}(\\pi(\\cdot|s_t)) = - \\int_A \\pi(a|s_t) \\log \\pi(a|s_t) \\, da", "meaning": "現在の状態 $s_t$ において行動方針 $\\pi$ がどれだけランダムで多様な選択肢を持っているかを算出するエントロピーの定義式です。"}], "addedDate": "2026-10-24"}, {"paperId": "5b6ec746d309b165f9f9def873a2375b6fb40f3d", "arxivId": "1610.02357", "title": "Xception: Deep Learning with Depthwise Separable Convolutions", "year": 2016, "published": "2016", "categories": [], "citationCount": 18748, "influentialCitationCount": 1984, "url": "https://arxiv.org/abs/1610.02357", "summary": "", "terms": {}, "formulas": [], "addedDate": "2026-10-24"}, {"paperId": "f35de4f9b1a7c4d3fa96a0d2ab1bf8937671f6b6", "arxivId": "1506.02142", "title": "Dropout as a Bayesian Approximation: Representing Model Uncertainty in Deep Learning", "year": 2015, "published": "2015", "categories": [], "citationCount": 13320, "influentialCitationCount": 1759, "url": "https://arxiv.org/abs/1506.02142", "summary": "深層学習は高い精度で予測を行える一方で、その予測に対してAI自身がどれくらい自信を持っているかという「不確実性」を把握することが苦手でした。確信度を正しく測る手法としてベイズ統計学に基づくモデルがありますが、計算量が膨大で実用的ではないという問題がありました。そこで本論文では、モデルの過学習を防ぐためによく使われる「ドロップアウト」という既存の技術を、予測時にも複数回実行する手法を提案しました。これにより、ドロップアウトをベイズ計算の近似として数学的に位置づけ、追加の計算コストをかけずに予測のばらつきから不確実性を導き出せるようにしました。画像認識や強化学習などの実験を通して、予測精度の高さを維持したまま、AIの判断の迷いを正しく数値化できることを実証しました。", "terms": {"ドロップアウト": "学習中に一部のニューロン（計算の結び目）をランダムに無効化することで、特定のパターンに過度に依存するのを防ぐ手法です。", "不確実性（モデルの不確実性）": "AIが下した予測に対して、どの程度迷いや自信のなさがあるかを表す指標です。", "ベイズ推定": "手に入ったデータをもとに、ある事象が起こる確率を段階的に更新して推測する統計的な手法です。", "ガウス過程": "無数のデータ点間の関係性を確率的な関数の集まりとして捉え、予測とそのばらつきを同時に扱える数学モデルです。"}, "formulas": [{"expression": "z_{i, j} \\sim \\text{Bernoulli}(p_i)", "meaning": "各層のニューロンを残すか無効化するかを、コイン投げのように確率 $p_i$ で決めるベルヌーイ分布を表しています。"}, {"expression": "\\mathbb{E}[y^*] \\approx \\frac{1}{T} \\sum_{t=1}^T \\hat{y}^*_t", "meaning": "テスト時にもドロップアウトを適用して $T$ 回予測を行い、その平均値を最終的な予測結果とすることを表しています。"}, {"expression": "\\text{Var}(y^*) \\approx \\tau^{-1} I + \\frac{1}{T} \\sum_{t=1}^T (\\hat{y}^*_t)^T \\hat{y}^*_t - (\\mathbb{E}[y^*])^T \\mathbb{E}[y^*]", "meaning": "複数回行った予測値のばらつき（分散）を計算することで、AIの予測に対する不確実性を数値化する式です。"}], "addedDate": "2026-10-24"}, {"paperId": "3f5b31c4f7350dc88002c121aecbdc82f86eb5bb", "arxivId": "2301.12597", "title": "BLIP-2: Bootstrapping Language-Image Pre-training with Frozen Image Encoders and Large Language Models", "year": 2023, "published": "2023", "categories": [], "citationCount": 9604, "influentialCitationCount": 1026, "url": "https://arxiv.org/abs/2301.12597", "summary": "", "terms": {}, "formulas": [], "addedDate": "2026-10-24"}, {"paperId": "f04df4e20a18358ea2f689b4c129781628ef7fc1", "arxivId": "1508.05326", "title": "A large annotated corpus for learning natural language inference", "year": 2015, "published": "2015", "categories": [], "citationCount": 4878, "influentialCitationCount": 932, "url": "https://arxiv.org/abs/1508.05326", "summary": "", "terms": {}, "formulas": [], "addedDate": "2026-10-24"}, {"paperId": "642d0f49b7826adcf986616f4af77e736229990f", "arxivId": "1510.00149", "title": "Deep Compression: Compressing Deep Neural Network with Pruning, Trained Quantization and Huffman Coding", "year": 2015, "published": "2015", "categories": [], "citationCount": 10594, "influentialCitationCount": 931, "url": "https://arxiv.org/abs/1510.00149", "summary": "", "terms": {}, "formulas": [], "addedDate": "2026-10-24"}, {"paperId": "d0611891b9e8a7c5731146097b6f201578f47b2f", "arxivId": "1707.07012", "title": "Learning Transferable Architectures for Scalable Image Recognition", "year": 2017, "published": "2017", "categories": [], "citationCount": 6  2595, "influentialCitationCount": 605, "url": "https://arxiv.org/abs/1612.02177", "summary": "", "terms": {}, "formulas": [], "addedDate": "2026-10-24"}, {"paperId": "f63e917638553414526a0cc8550de4ad2d83fe7a", "arxivId": "1511.07289", "title": "Fast and Accurate Deep Network Learning by Exponential Linear Units (ELUs)", "year": 2015, "published": "2015", "categories": [], "citationCount": 6238, "influentialCitationCount": 575, "url": "https://arxiv.org/abs/1511.07289", "summary": "", "terms": {}, "formulas": [], "addedDate": "2026-10-24"}, {"paperId": "13a0d8bb38f739990c8cd65a44061c6534f17221", "arxivId": "2205.01068", "title": "OPT: Open Pre-trained Transformer Language Models", "year": 2022, "published": "2022", "categories": [], "citationCount": 5066, "influentialCitationCount": 540, "url": "https://arxiv.org/abs/2205.01068", "summary": "", "terms": {}, "formulas": [], "addedDate": "2026-10-24"}, {"paperId": "0286b2736a114198b25fb5553c671c33aed5d477", "arxivId": "2204.05862", "title": "Training a Helpful and Harmless Assistant with Reinforcement Learning from Human Feedback", "year": 2022, "published": "2022", "categories": [], "citationCount": 4425, "influentialCitationCount": 529, "url": "https://arxiv.org/abs/2204.05862", "summary": "", "terms": {}, "formulas": [], "addedDate": "2026-10-24"}, {"paperId": "d21703674ae562bae4a849a75847cdd9ead417df", "arxivId": "1606.04838", "title": "Optimization Methods for Large-Scale Machine Learning", "year": 2016, "published": "2016", "categories": [], "citationCount": 4122, "influentialCitationCount": 520, "url": "https://arxiv.org/abs/1606.04838", "summary": "", "terms": {}, "formulas": [], "addedDate": "2026-10-24"}, {"paperId": "af9f365ed86614c800f082bd8eb14be76072ad16", "arxivId": "2207.12598", "title": "Classifier-Free Diffusion Guidance", "year": 2022, "published": "2022", "categories": [], "citationCount": 7547, "influentialCitationCount": 1092, "url": "https://arxiv.org/abs/2207.12598", "summary": "画像生成AIである拡散モデルでは、テキストの指示にどれだけ忠実に画像を生成させるかが重要な課題でした。従来の技術では、画像が指示に合っているかを判定する別の「分類器」を学習させて生成を誘導していましたが、ノイズ交じりの画像を判定する専用の分類器を作るには大きな手間がかかっていました。そこで本論文は、分類器を別途用意せず、1つのモデルだけで指示付きの画像生成と指示なしの画像生成の両方を同時に学ばせる手法を提案しました。生成時には、指示ありの予測結果から指示なしの予測結果の差分を強調することで、指示に強く従った鮮明な画像を作り出せます。この仕組みは現在の主要な画像生成AIの基盤技術として広く使われています。", "terms": {"拡散モデル": "きれいな画像に少しずつノイズ（砂嵐）を加えていき、逆にそのノイズを少しずつ取り除くことで新しい画像を生成するAI技術です。", "ガイダンス": "AIが画像を生成する際に、入力された指示文やカテゴリの特徴をより強く反映させるよう誘導する仕組みです。", "条件付き生成": "単に画像を生成するのではなく、「猫の絵文字文字」のように特定の指示や条件を与えてそれに沿った画像を生成することです。", "ガイダンススケール": "ユーザーの指示文をどのくらい強く画像に反映させるかを調整する数値パラメータのことです。"}, "formulas": [{"expression": "\\tilde{\\epsilon}_\\theta(z_t, c) = (1 + w)\\epsilon_\\theta(z_t, c) - w\\epsilon_\\theta(z_t)", "meaning": "条件付きのノイズ予測$\\epsilon_\\theta(z_t, c)$と条件なしのノイズ予測$\\epsilon_\\theta(z_t)$を組み合わせ、重み$w$で指示の影響度を強調して最終的な予測値とする計算式です。"}, {"expression": "w \\ge 0", "meaning": "ガイダンスの強さを表すパラメータで、数値を大きくするほど指示文への忠実さが増す一方で、画像の多様性が下がるトレードオフがあります。"}], "addedDate": "2026-10-24"}, {"paperId": "d7890d1906d95c4ae4c430b350455156d6d8aed9", "arxivId": "2307.01952", "title": "SDXL: Improving Latent Diffusion Models for High-Resolution Image Synthesis", "year": 2023, "published": "2023", "categories": [], "citationCount": 5604, "influentialCitationCount": 1000, "url": "https://arxiv.org/abs/2307.01952", "summary": "テキストから画像を生成するAI「Stable Diffusion」を大幅に進化させたモデル「SDXL」に関する論文です。従来のモデルでは、高解像度の画像を生成しようとすると構図が崩れたり人物の手足が不自然になったりする問題がありました。SDXLでは、モデルの頭脳にあたるネットワークの規模を約3倍に拡大し、指示文を解釈するテキスト解析器を2種類組み合わせることで理解力を高めました。さらに、画像の切り抜き位置や元の解像度といった情報をモデルに教え込む工夫や、画像の細部を仕上げる別の改善モデルを導入しました。これにより、1024×1024ピクセルという高解像度でも破綻の少ない、リアルで美しい画像を安定して生成できるようになりました。", "terms": {"潜在拡散モデル": "画像そのものを直接加工するのではなく、データを圧縮したコンパクトな空間（潜在空間）でノイズ除去を行うことで、動作を軽くした拡散モデルのことです。", "テキストエンコーダー": "人間が入力した言葉をAIが理解できる数字の並び（ベクトル）に変換する辞書のような役割を持つ部品です。", "リファイナーモデル": "ベースとなるモデルが生成した画像の粗削りな部分を引き継ぎ、細部の質感や輪郭をきれいに仕上げる追加のAIモデルです。", "クロスアテンション": "テキストのどの単語が画像のどの部分に対応しているのかを結びつけて計算する仕組みです。"}, "formulas": [{"expression": "c_{\\text{size}} = (h, w)", "meaning": "学習させる元の画像の高さ$h$と幅$w$を条件情報としてモデルに入力し、低解像度の引き伸ばしによるボケを学習時に区別させるための変数です。"}, {"expression": "c_{\\text{crop}} = (y_{\\text{top}}, x_{\\text{left}})", "meaning": "画像から学習範囲を切り抜いた際の左上の座標を指定し、生成される被写体が意図せず画面端で切れてしまう現象を防ぐための条件情報です。"}], "addedDate": "2026-10-24"}, {"paperId": "8877e9a5bf473404c35b758faa76905c202f0f36", "arxivId": "2503.20314", "title": "Wan: Open and Advanced Large-Scale Video Generative Models", "year": 2025, "published": "2025", "categories": [], "citationCount": 2993, "influentialCitationCount": 900, "url": "https://arxiv.org/abs/2503.20314", "summary": "指示文や画像から滑らかで高品質な動画を作り出すオープンな動画生成AI「Wan」に関する報告書です。動画の生成は、静止画に比べて「時間の経過に伴う自然な動き」を再現する必要があり、計算量が膨大になるという課題がありました。Wanでは、動画データを空間と時間の両面から効率よく圧縮する新しい技術と、高い性能を持つTransformer構造を組み合わせたモデルを採用しました。さらに、動画データの徹底したクリーニングと効率的な学習の進め方を確立することで、動きの破綻を抑えています。これにより、物理法則に反しない自然な動きを持つ鮮明な動画を生成できるようになりました。", "terms": {"Diffusion Transformer": "画像や動画の生成で使われる拡散モデルの骨組みに、言語モデルなどで成果を上げているTransformer構造を組み込んだ最新のAI設計です。", "VAE (変分オートエンコーダー)": "動画や画像の大容量データを特徴を保ったまま小さく圧縮し、後から復元できるようにする変換器のことです。", "テキスト動画生成": "「走る柴犬」のような文章を入力すると、その内容に合った動画を自動で一から作り出す技術です。", "時空間パッチ": "動画の「縦・横の広がり（空間）」と「時間の流れ（時間）」を格子状の小さなブロックに分割してAIが扱いやすくした単位です。"}, "formulas": [{"expression": "z = \\mathcal{E}(x)", "meaning": "元の動画データ$x$を変分オートエンコーダーのエンコーダー$\\mathcal{E}$によって、コンパクトな潜在表現$z$に圧縮する処理を表します。"}, {"expression": "\\mathcal{L}_{\\text{diff}} = \\mathbb{E}_{t, x_0, \\epsilon} \\left[ \\| \\epsilon - \\epsilon_\\theta(z_t, t, c) \\|^2 \\right]", "meaning": "動画の潜在表現に加えられたノイズ$\\epsilon$と、モデルが予測したノイズ$\\epsilon_\\theta$の誤差を計算し、モデルを賢くするための学習の目的関数です。"}], "addedDate": "2026-10-24"}, {"paperId": "2f4c451922e227cbbd4f090b74298445bbd900d0", "arxivId": "2206.00364", "title": "Elucidating the Design Space of Diffusion-Based Generative Models", "year": 2022, "published": "2022", "categories": [], "citationCount": 4062, "influentialCitationCount": 804, "url": "https://arxiv.org/abs/2206.00364", "summary": "拡散モデルを用いた画像生成は急速に発展した一方で、様々な手法や複雑な数式が入り乱れ、どの工夫が画質の向上に本当に効いているのかが分かりにくくなっていました。本論文は、拡散モデルの学習と画像生成の工程を整理し、構成要素を明確に切り分けた共通の設計図を提示しました。その上で、AIに入力する数値の前処理の仕方、ノイズを加えるスケジュール、効率的に画像を復元する計算手法などを一つずつ実験して最適な組み合わせを突き止めました。この設計（通称EDM）を取り入れることで、複雑な理論に頼らずとも、より少ない計算回数で極めて高品質な画像を生成できるようになりました。", "terms": {"プレコンディショニング": "ニューラルネットワークが学習しやすくなるよう、入力や出力のデータの数値の大きさ（スケール）を適切な範囲に調整する工夫です。", "サンプラー": "ノイズだらけの状態から少しずつノイズを取り除いて、目的の画像を段階的に組み立てていく計算アルゴリズムのことです。", "スコアベースモデル": "データが集まっている方向（確率の傾き）を予測することで、ノイズを消して元のデータに近づける生成モデルの考え方です。", "FID": "生成された画像が本物の写真とどれくらい似ているかを測る数値で、値が小さいほど高品質で自然な画像であることを示します。"}, "formulas": [{"expression": "D_\\theta(x; \\sigma) = c_{\\text{skip}}(\\sigma)x + c_{\\text{out}}(\\sigma)F_\\theta(c_{\\text{in}}(\\sigma)x; c_{\\text{noise}}(\\sigma))", "meaning": "ノイズ量$\\sigma$に応じて入出力を適切にスケーリングし、ネットワーク$F_\\theta$の学習負担を減らして安定してノイズを除去するための式です。"}, {"expression": "\\sigma(t) = t", "meaning": "時間の経過$t$と画像に含まれるノイズの標準偏差$\\sigma$を直接対応させ、数式の見通しを劇的にシンプルにしたノイズ設定です。"}], "addedDate": "2026-10-24"}, {"paperId": "4c05d7caa357148f0bbd61720bdd35f0bc05eb81", "arxivId": "1511.06581", "title": "Dueling Network Architectures for Deep Reinforcement Learning", "year": 2015, "published": "2015", "categories": [], "citationCount": 4641, "influentialCitationCount": 500, "url": "https://arxiv.org/abs/1511.06581", "summary": "AIが試行錯誤を通じてゲームの攻略法などを学ぶ強化学習において、新しいニューラルネットワークの構造を提案した論文です。従来の代表的な手法では、現在の画面から「右に動く」「ジャンプする」といった各行動をとったときに得られる価値を一度に予測していました。しかし、敵がいない安全な場所などでは、どの行動をとっても状況の良さはあまり変わりません。そこで本研究は、「現在の状況自体の良さ」と「他の行動と比べてその行動がどれくらい優れているか」を別々の回路で予測し、最後に合体させるネットワーク構造を開発しました。この工夫により、無駄な行動の比較に惑わされなくなり、ゲームなどの学習が大幅に安定して高速化しました。", "terms": {"強化学習": "AIが環境の中で自ら行動し、うまくいったら報酬をもらうという試行錯誤を繰り返すことで最適な手順を身につける手法です。", "Q値 (行動価値)": "ある状況において、特定の行動をとった場合に将来トータルでどれくらいの報酬が得られそうかを表す見込み点数です。", "状態価値": "どんな行動をとるかに関わらず、「今置かれている状況そのものがどれくらい有利か」を表す点数です。", "アドバンテージ": "ある行動が、その状況でとれる平均的な行動と比べて「どれくらい特別に良いか」を表す相対的な差分です。"}, "formulas": [{"expression": "Q(s, a) = V(s) + A(s, a)", "meaning": "ある状況$s$で行動$a$をとる価値$Q$は、状況自体の良さ$V(s)$と、その行動の相対的な優位性$A(s, a)$の足し算で表せるという基本原理です。"}, {"expression": "Q(s, a; \\theta, \\alpha, \\beta) = V(s; \\theta, \\beta) + \\left( A(s, a; \\theta, \\alpha) - \\frac{1}{|\\mathcal{A}|}\\sum_{a'} A(s, a'; \\theta, \\alpha) \\right)", "meaning": "状態価値$V$とアドバンテージ$A$を一意に決定できるように、アドバンテージの平均値を引き算して安定して計算できるようにしたネットワークの出力式です。"}], "addedDate": "2026-10-24"}, {"paperId": "348a855fe01f3f4273bf0ecf851ca688686dbfcc", "arxivId": "2110.06169", "title": "Offline Reinforcement Learning with Implicit Q-Learning", "year": 2021, "published": "2021", "categories": [], "citationCount": 1852, "influentialCitationCount": 479, "url": "https://arxiv.org/abs/2110.06169", "summary": "ロボット操作などの強化学習において、AIが実世界で危険な試行錯誤をすることなく、事前に記録されたログデータのみから学習する手法を「オフライン強化学習」と呼びます。しかし従来のやり方では、過去のデータに載っていない行動の価値をAIが過大評価してしまい、実際のテストで失敗しやすいという深刻な問題がありました。本論文が提案した「IQL」は、過去の記録に存在しない行動をそもそも評価しないようにする数式上の工夫を取り入れました。データに記録されている行動の中から「より良い結果をもたらした行動」だけを統計的に拾い上げることで、安全かつシンプルに最適な行動手順を学習できるようにしました。", "terms": {"オフライン強化学習": "追加の実験やシミュレーションを行わず、過去に収集した運転ログなどの既存データセットだけを使って賢い行動を学ぶ強化学習です。", "分布シフト": "AIが学習時に見たデータの内容と、実際にテストするときに遭遇する状況がズレてしまい、間違った判断をしてしまう現象です。", "Q学習": "将来得られる報酬の合計を予測しながら、最も点数が高くなる行動を選べるように学習していく強化学習の定番アルゴリズムです。", "期待値回帰": "平均値ではなく「上位数パーセントの優秀なデータ」に重点を置いて数値を予測する統計的な学習テクニックです。"}, "formulas": [{"expression": "L_2^\\tau(u) = |\\tau - \\mathbb{I}(u < 0)| u^2", "meaning": "予測誤差$u$に対して、正の誤差と負の誤差で異なる重み$\\tau$をかけることで、平均ではなく上位の良い行動の結果を捉える損失関数です。"}, {"expression": "L_V(\\psi) = \\mathbb{E}_{(s,a)\\sim \\mathcal{D}} \\left[ L_2^\\tau(Q_{\\hat{\\theta}}(s,a) - V_\\psi(s)) \\right]", "meaning": "データに存在する行動の価値$Q$の中から、より上位の価値を持つ水準を状況の価値$V_\\psi(s)$として推定するための計算式です。"}], "addedDate": "2026-10-24"}, {"paperId": "1d122a074c936fcfd95faf44608e377a9d1799c8", "arxivId": "1703.04247", "title": "DeepFM: A Factorization-Machine based Neural Network for CTR Prediction", "year": 2017, "published": "2017", "categories": [], "citationCount": 3271, "influentialCitationCount": 463, "url": "https://arxiv.org/abs/1703.04247", "summary": "インターネット広告やECサイトでは、ユーザーが提示された商品をタップするかどうか（クリック率）を正しく予測することが極めて重要です。予測の精度を上げるには、「20代」と「夜間」のように特徴同士が組み合わさったときの傾向を捉える必要がありますが、人間が手作業で組み合わせを考えるのには限界がありました。本論文で提案された「DeepFM」は、シンプルな組み合わせを効率よく計算する手法と、何層も重なった複雑な組み合わせを捉えるディープラーニングを合体させたモデルです。入力データを2つの回路で同時に処理することで、事前の手作業による特徴作りを一切行うことなく、クリック率を高い精度で予測することに成功しました。", "terms": {"クリック率 (CTR)": "表示されたウェブ広告やおすすめ商品が、ユーザーにクリックされる確率のことです。", "特徴量の相互作用": "「性別」「時間帯」「商品のカテゴリ」など複数の情報が掛け合わさることで初めて現れる、ユーザーの好みのパターンのことです。", "Factorization Machine (FM)": "データがまばら（疎）な場合でも、項目同士の2通りの掛け合わせを効率よく学習できる数理モデルです。", "エンドツーエンド学習": "生データを入力するだけで、人間が前処理や特徴抽出を細かく設計しなくても、目的の予測結果までAIが直接丸ごと学習する仕組みです。"}, "formulas": [{"expression": "\\hat{y} = \\text{sigmoid}(y_{FM} + y_{DNN})", "meaning": "FM回路が計算した低次の特徴の組み合わせ$y_{FM}$と、DNN回路が計算した高次の複雑な組み合わせ$y_{DNN}$を足し合わせ、0から1の確率に変換してクリック率を予測する式です。"}, {"expression": "y_{FM} = \\langle w, x \\rangle + \\sum_{i=1}^d \\sum_{j=i+1}^d \\langle v_i, v_j \\rangle x_i x_j", "meaning": "各特徴量$x_i, x_j$の単体の影響力（前半）と、2つの特徴の掛け合わせによる影響力（後半）をベクトル$v$の内積を使って効率よく計算する式です。"}], "addedDate": "2026-10-24"}, {"paperId": "6a33e58ef961a3a0a5657518b2be86395eb7c8d0", "arxivId": "2312.14238", "title": "Intern VL: Scaling up Vision Foundation Models and Aligning for Generic Visual-Linguistic Tasks", "year": 2023, "published": "2023", "categories": [], "citationCount": 3539, "influentialCitationCount": 426, "url": "https://arxiv.org/abs/2312.14238", "summary": "文章を扱う大規模言語モデル（LLM）が目覚ましい進化を遂げる一方で、画像を理解するAIモデルは言語モデルほどのスケールアップが進んでおらず、能力の開きが生じていました。そこで本研究は、画像を解析する視覚基盤モデルの規模を60億パラメータという非常に大きなサイズに拡大した「InternVL」を開発しました。大量の画像と説明文の組み合わせを学習させた上で、視覚モデルの出力を大規模言語モデルがそのまま受け取れるように滑らかに接続しました。この連携によって、画像の中に何が写っているかを細かく説明したり、画像を見ながら複雑な質問に答えたりする能力が大幅に向上しました。", "terms": {"マルチモーダルAI": "文字（テキスト）、画像、音声など、異なる種類の情報を同時に扱って総合的に理解・処理できるAIのことです。", "視覚基盤モデル": "様々な画像認識タスク（物体検出や分類など）の土台として使えるように、あらかじめ膨大な画像データで鍛えられた大規模な画像認識AIです。", "アライメント": "画像認識モデルが見て理解した内容の表現を、言語モデルが正しく読み取れるように両者の「解釈の基準」をすり合わせることです。", "パラメータ数": "AIの脳の中にある神経のつなぎ目の数のようなもので、この数が多いほど一般に複雑な知識を記憶して高度な処理ができます。"}, "formulas": [{"expression": "\\mathcal{L}_{\\text{contrastive}} = - \\frac{1}{N} \\sum_{i=1}^N \\log \\frac{\\exp(\\text{sim}(v_i, t_i)/\\tau)}{\\sum_{j=1}^N \\exp(\\text{sim}(v_i, t_j)/\\tau)}", "meaning": "対応する画像ベクトル$v_i$とテキストベクトル$t_i$の類似度を近づけ、無関係な組み合わせの類似度を遠ざけるように学習させる対照学習の損失関数です。"}, {"expression": "\\text{sim}(v, t) = \\frac{v^\\top t}{\\|v\\| \\|t\\|}", "meaning": "画像の特徴ベクトル$v$とテキストの特徴ベクトル$t$の向きがどれくらい一致しているかをコサイン類似度で測る計算式です。"}], "addedDate": "2026-10-24"}, {"paperId": "798d9840d2439a0e5d47bcf5d164aa46d5e7dc26", "arxivId": "", "title": "Pseudo-Label : The Simple and Efficient Semi-Supervised Learning Method for Deep Neural Networks", "year": 2013, "published": "2013", "categories": [], "citationCount": 4909, "influentialCitationCount": 424, "url": "https://www.semanticscholar.org/paper/798d9840d2439a0e5d47bcf5d164aa46d5e7dc26", "summary": "AIの学習には「正解のラベル」がついたデータが大量に必要ですが、すべてのデータに人間が手作業で正解をつけるのは大変な手間とコストがかかります。一方で、正解がついていないデータ（ラベルなしデータ）ならインターネットなどから簡単に集めることができます。本論文は、正解のないデータに対して学習途中のAI自身に予測させ、最も自信のある予測結果を「仮の正解（疑似ラベル）」としてデータに割り当てて再学習させる手法を提案しました。学習が進んでAIの賢さが増すにつれて、疑似ラベルの重要度を徐々に高くしていくシンプルな仕組みを導入しています。これにより、手作業でラベルをつけたデータがわずかしかなくても、認識精度を大きく引き上げることに成功しました。", "terms": {"半教師あり学習": "少量の「正解ラベル付きデータ」と大量の「正解がないデータ」を組み合わせて、効率よくAIを賢くする学習方法です。", "疑似ラベル (Pseudo-Label)": "正解がわからないデータに対して、学習中のAIが推測した最も確率の高い答えを、本物の正解であるかのように見なして学習に使うラベルのことです。", "教師あり学習": "問題と人間が用意した「正しい答え」のペアをAIにたくさん見せて学習させる、最も基本的な機械学習の方法です。", "エントロピー正則化": "AIが予測するときに「どっちつかずの曖昧な判断」を減らし、「どちらか一方だと自信を持って判断する」ように促す数学的な制約のことです。"}, "formulas": [{"expression": "y_i' = \\text{argmax}_k \\, f_k(x_i')", "meaning": "ラベルのないデータ$x_i'$をモデル$f$に入力し、最も予測確率が高かったクラスの番号$k$をそのまま疑似ラベル$y_i'$として採用することを示します。"}, {"expression": "L = \\frac{1}{n}\\sum_{i=1}^n L(y_i, f(x_i)) + \\alpha(t)\\frac{1}{n'}\\sum_{i=1}^{n'} L(y_i', f(x_i'))", "meaning": "本物の正解データでの誤差（左側）と疑似ラベルを使った誤差（右側）を合計する式で、係数$\\alpha(t)$によって学習が進むほど疑似ラベルの影響を徐々に強めます。"}], "addedDate": "2026-10-24"}, {"paperId": "8e9149ab00236d04db23394774e716c4f1d89231", "arxivId": "1507.05717", "title": "An End-to-End Trainable Neural Network for Image-Based Sequence Recognition and Its Application to Scene Text Recognition", "year": 2015, "published": "2015", "categories": [], "citationCount": 3075, "influentialCitationCount": 422, "url": "https://arxiv.org/abs/1507.05717", "summary": "街中の看板や標識などに書かれた文字を写真から読み取る「文字認識」は、文字の長さや形が千差万別であるため難しい課題でした。従来の技術では、画像をまず1文字ずつ枠で囲んで切り取ってから認識していましたが、文字の切れ目を間違えると全体の読み取りに失敗してしまう欠点がありました。本論文では、画像の切り出しを行わずに、画像全体から一気に文字列を読み取るAIモデル「CRNN」を提案しました。画像の特徴を捉えるCNN、前後の文字のつながりを理解するRNN、そして文字の位置のズレを自動調整してテキストに変換するCTCという3つの技術を1本のパイプラインにまとめました。これにより、文字の切り分け作業を必要とせず、高速かつ正確に画像から文字を読み取れるようになりました。", "terms": {"CRNN": "画像を処理するCNNと、前後の文脈やつながりを扱うRNNを組み合わせた、画像から連続するテキストを読み取るためのニューラルネットワークです。", "自然シーンテキスト認識": "スキャナーで読み取った平らな書類ではなく、街中の風景写真に写り込んだ看板や道路標識などの変形した文字を読み取る技術です。", "CTC": "文字が画像のどの位置に書かれているかを厳密に指定しなくても、予測された文字の並びと正解の単語を自動で対応づけてくれる計算手法です。", "エンドツーエンド学習": "「文字の切り出し」「文字の判定」「単語の組み立て」などの工程を分けることなく、入力画像から出力テキストまでを1つのモデルで丸ごと学習する仕組みです。"}, "formulas": [{"expression": "p(l|x) = \\sum_{\\pi: \\mathcal{B}(\\pi) = l} p(\\pi|x)", "meaning": "重複した文字や空白記号を取り除く変換処理$\\mathcal{B}$を行った結果が正しい文字列$l$になるような、すべての出力パターン$\\pi$の確率を足し合わせて全体の正解確率を求める式です。"}, {"expression": "l^* \\approx \\mathcal{B}\\left(\\arg\\max_\\pi p(\\pi|x)\\right)", "meaning": "各ステップで最も確率が高い文字を順番に選び出し、重複した文字をまとめることで、画像から最終的な読み取り結果の文字列$l^*$を高速に決定する計算です。"}], "addedDate": "2026-10-24"}, {"paperId": "e30d9b8ce108d982169621b88a5e3fb69fec70e1", "arxivId": "1604.03169", "title": "Using Deep Learning for Image-Based Plant Disease Detection", "year": 2016, "published": "2016", "categories": [], "citationCount": 4803, "influentialCitationCount": 421, "url": "https://arxiv.org/abs/1604.03169", "summary": "作物の病気は食料の安定供給にとって深刻な問題ですが、多くの地域では専門家が不足しており、早期の発見が困難でした。一方で、スマートフォンの普及と画像認識技術の進歩により、写真から手軽に病気を診断できる可能性が広がっています。この研究では、5万枚以上の健康な葉と病気の葉の写真を集めた公開データセットを用意しました。その画像を使ってディープラーニングのモデルを学習させ、葉の写真から病気の種類を高精度に判別できることを確かめました。将来的には、農家がスマートフォンで葉を撮影するだけで病気を診断できるシステムの実現を目指しています。", "terms": {"ディープラーニング": "人間の脳の神経回路を模した仕組みを何層も重ねることで、画像などの複雑なデータから自動で特徴を学習する技術です。", "畳み込みニューラルネットワーク (CNN)": "画像の中から輪郭や模様などの視覚的な特徴を見つけ出すことが得意な、ディープラーニングの一種です。", "データセット": "AIにパターンを学習させたり、正しく学習できたかをテストしたりするために集められた、整理されたデータの集まりです。", "過学習 (オーバーフィッティング)": "AIが訓練用の画像ばかりを細かく覚えすぎてしまい、初めて見る新しい画像に対してうまく正解できなくなる現象です。"}, "formulas": [{"expression": "Accuracy = \\frac{N_{\\text{correct}}}{N_{\\text{total}}}", "meaning": "すべての画像のうち、AIが正しく病気や健康状態を言い当てられた画像の割合（正解率）を表しています。"}, {"expression": "L = - \\sum_{i} y_i \\log(p_i)", "meaning": "正解ラベルとAIの予測確率のズレの大きさを計算する式で、このズレを最小にするようにAIを調整します。"}], "addedDate": "2026-10-24"}, {"paperId": "0d11a9674b68216b92e08cf7617a93fbd3fb91f4", "arxivId": "2502.09992", "title": "Large Language Diffusion Models", "year": 2025, "published": "2025", "categories": [], "citationCount": 1031, "influentialCitationCount": 406, "url": "https://arxiv.org/abs/2502.09992", "summary": "現在の文章を生成するAIの多くは、左から右へと1単語ずつ順番に予測して文章を作っています。この研究ではその常識を見直し、画像生成でよく使われる「拡散モデル」を文章生成に応用したLLaDAという手法を提案しました。この手法では、文章の一部を隠して虫食い状態にし、それをAIが少しずつ復元していく過程を学習します。一度に文章全体のバランスを見ながら修正・生成できるため、従来の順番通りに書く方式とは異なる柔軟な文章作成が可能です。大規模なデータで事前学習と指示への調整を行うことで、従来の方式に匹敵する性能を示しました。", "terms": {"自己回帰モデル": "「私は」「ご飯を」の次に「食べた」が来るように、前の単語から次の単語を順番に1つずつ予測していく文章生成の仕組みです。", "拡散モデル": "データに少しずつノイズ（乱れ）を加えていき、逆にそのノイズを少しずつ取り除いて元に戻す手順を学ぶことで、新しいデータを生成する技術です。", "事前学習": "特定の作業専用にする前に、インターネット上の膨大な文章を幅広く読み込ませて、言葉の基本的なルールや知識を覚えさせる段階です。", "ファインチューニング": "事前学習を終えたAIに対して、質問への回答や要約など、特定の用途に合わせた受け答えができるように追加で学習させることです。"}, "formulas": [{"expression": "q(x_t | x_0)", "meaning": "元の文章（$x_0$）の単語を時間ステップ（$t$）が進むにつれて少しずつ隠していく（ノイズを加える）確率的な変換を表します。"}, {"expression": "p_\\theta(x_{t-1} | x_t)", "meaning": "隠された単語が含まれる文章（$x_t$）から、隠される前の元の文章（$x_{t-1}$）をAIのパラメータ（$\\theta$）を使って段階的に予測・復元する過程を表します。"}], "addedDate": "2026-10-24"}, {"paperId": "5285cb8faada5de8a92a47622950f6cfd476ac1d", "arxivId": "1812.02900", "title": "Off-Policy Deep Reinforcement Learning without Exploration", "year": 2018, "published": "2018", "categories": [], "citationCount": 2245, "influentialCitationCount": 401, "url": "https://arxiv.org/abs/1812.02900", "summary": "試行錯誤を通じて最適な行動を学ぶ強化学習は、現実世界ではロボットの破損や事故の危険があるため、自由な実験が難しい場合があります。そこで、事前に集めておいた過去の行動記録データだけを使って学習する「オフライン強化学習」が求められます。しかし従来のやり方では、過去のデータに存在しない行動をとったときの成果をAIが過大評価してしまい、学習に失敗するという問題がありました。この研究では、集めたデータから大きく外れた危険な行動を選ばないように制約をかける新しい学習法（BCQ）を提案しました。これにより、新たな探索を行わなくても過去のデータのみから安全かつ上手に学習できるようになりました。", "terms": {"強化学習": "試行錯誤を繰り返しながら、成功したときにもらえる「報酬」が最も多くなるような行動のルールを身につけるAI技術です。", "オフライン強化学習": "その場で実際に行動して結果を試すのではなく、あらかじめ記録された過去の行動データだけを見て学習する方式です。", "外挿誤差 (Extrapolation Error)": "過去の記録にない未知の行動を選んだときに、その結果をAIが都合よく過大に見積もってしまう誤りのことです。", "方策 (ポリシー)": "どのような状況のときにどの行動を選択するかを決める、AIの判断基準のことです。"}, "formulas": [{"expression": "Q(s, a) = r + \\gamma \\max_{a'} Q(s', a')", "meaning": "現在の状況（$s$）で特定の行動（$a$）をとったときに、直後の報酬（$r$）と将来得られる最大の報酬を足し合わせた総合的な価値を表す計算式です。"}, {"expression": "a = \\arg\\max_{a \\text{ s.t. } (s, a) \\in \\text{データ}} Q(s, a)", "meaning": "データの中に実際に存在し、かつ将来の報酬（$Q$）が最も高くなるような行動だけを選ぶという制約ルールを表しています。"}], "addedDate": "2026-10-24"}, {"paperId": "c1ad5f9b32d80f1c65d67894e5b8c2fdf0ae4500", "arxivId": "2106.01345", "title": "Decision Transformer: Reinforcement Learning via Sequence Modeling", "year": 2021, "published": "2021", "categories": [], "citationCount": 2605, "influentialCitationCount": 381, "url": "https://arxiv.org/abs/2106.01345", "summary": "従来の強化学習は、行動ごとの点数を計算したり確率を調整したりする複雑な仕組みを使っていました。この研究では発想を転換し、強化学習を文章生成AIと同じ「次に続くデータを予測する問題」として捉え直しました。具体的には、「過去の状況」「選んだ行動」「獲得した報酬」を単語のように一列に並べ、ChatGPTなどでも使われるトランスフォーマーという技術に入力します。AIは「これくらいの高い報酬を得るためには、次にどんな行動をとるべきか」を文脈から予測して決定します。これにより、従来の複雑な強化学習の計算を行わずに、既存の言語モデルと同じシンプルな仕組みで優れた行動をとることが可能になりました。", "terms": {"トランスフォーマー": "文章などの長いデータの前後関係や文脈を、効率よく素早く理解できるディープラーニングの構造です。", "シーケンスモデリング": "時系列データや文章のように、順番に並んだ要素の流れから、その次に何が来るかを予測する枠組みです。", "リターン (累積報酬)": "最初から最後まで行動を続けた結果として、最終的に手に入る報酬の合計点のことです。", "自己回帰": "過去に生成した自分の出力を入力として再利用しながら、続きのデータを順番に作っていく手法です。"}, "formulas": [{"expression": "\\tau = (\\hat{R}_1, s_1, a_1, \\hat{R}_2, s_2, a_2, \\dots, \\hat{R}_T, s_T, a_T)", "meaning": "未来に欲しい目標報酬（$\\hat{R}$）、その時の状況（$s$）、とった行動（$a$）を時間順に並べた一連の記録を表しています。"}, {"expression": "\\hat{R}_t = \\sum_{t'=t}^{T} r_{t'}", "meaning": "現在時刻（$t$）から最終地点（$T$）までに獲得したい、未来の報酬の合計値を表しています。"}, {"expression": "L = \\sum_{t=1}^{T} (a_t - \\hat{a}_t)^2", "meaning": "実際に記録されている行動（$a_t$）と、AIが状況から予測した行動（$\\hat{a}_t$）とのズレの大きさを表す式です。"}], "addedDate": "2026-10-24"}, {"paperId": "3813b88a4ec3c63919df47e9694b577f4691f7e5", "arxivId": "", "title": "A survey on Image Data Augmentation for Deep Learning", "year": 2019, "published": "2019", "categories": [], "citationCount": 12594, "influentialCitationCount": 345, "url": "https://www.semanticscholar.org/paper/3813b88a4ec3c63919df47e9694b577f4691f7e5", "summary": "ディープラーニングで画像認識を行うには、何万枚もの大量の写真が必要になります。もしデータが少ないと、AIが見た目そのままの形を丸暗記してしまい、新しい画像に対応できなくなる問題が起きます。特に医療画像などでは大量のデータを集めることが難しいため、手持ちの画像を加工して人工的に増やす「データ拡張」という工夫が使われます。この論文は、画像を回転させたり色を変えたりする基本的な加工から、AIを使って本物そっくりの画像を新しく作り出す手法まで、様々なデータ拡張技術を整理して解説したものです。適切なデータ拡張を行うことで、データが少なくてもAIの認識能力を高められることを紹介しています。", "terms": {"データ拡張 (Data Augmentation)": "元の画像を少し回転させたり明るさを変えたりして、データのバリエーションを人工的に水増しする技術です。", "汎化性能": "学習に使っていない初めて見るデータに対しても、AIが正しく予測できる能力のことです。", "敵対的生成ネットワーク (GAN)": "本物そっくりの画像を作るAIと、それが見破るAIの2つを競い合わせることで、極めてリアルな画像を作り出す技術です。", "転移学習": "別の大量データで一度学習させたAIの知識を再利用して、データが少ない別の課題を効率よく学習させる方法です。"}, "formulas": [], "addedDate": "2026-10-24"}, {"paperId": "c879b25308026d6538e52b27bcf4fd3cb60855f3", "arxivId": "2106.06860", "title": "A Minimalist Approach to Offline Reinforcement Learning", "year": 2021, "published": "2021", "categories": [], "citationCount": 1331, "influentialCitationCount": 279, "url": "https://arxiv.org/abs/2106.06860", "summary": "事前に集められたデータのみから学習するオフライン強化学習は、データにない危険な行動をAIが過大評価してしまう課題を抱えています。これまでの解決法は、AIの行動がデータから外れないよう複雑な数式や追加の補助AIを組み込むことが多く、設定が難解でした。この研究では、既存の標準的なアルゴリズムに対して、人間や過去の行動をそのまま真似る「模倣学習」の要素をほんの少し付け加えるだけの極めて簡潔な手法（TD3+BC）を提案しました。さらに、データの数値の桁を揃える正規化を行うだけで、複雑な手法と同等以上の高い成果を出せることを実証しました。余計な複雑さを削ぎ落とし、最小限の工夫で実用的な学習ができることを示しています。", "terms": {"振る舞いクローン (Behavior Cloning)": "データに記録されている人間の操作や過去の履歴を、お手本としてそのまま真似するようにAIに覚えさせる手法です。", "正則化": "AIが極端な予測をしたり不自然な行動を選んだりしないよう、学習にブレーキ（ペナルティ）をかける仕組みです。", "正規化": "データの数値が大きすぎたり小さすぎたりすると学習が不安定になるため、扱いやすい範囲（平均0や標準偏差1など）に数値を揃える処理です。", "ハイパーパラメータ": "AI自身が自動で学ぶのではなく、人間があらかじめ設定しておかなければならない調整用ツマミのような数値です。"}, "formulas": [{"expression": "\\pi = \\arg\\max_\\pi \\mathbb{E}[Q(s, \\pi(s)) - \\alpha (\\pi(s) - a_{\\text{data}})^2]", "meaning": "将来の報酬（$Q$）が高くなる行動を目指しつつ、過去のデータにある行動（$a_{\\text{data}}$）から離れすぎないようにペナルティ（$\\alpha$の項）をかける決定ルールです。"}, {"expression": "s_{\\text{norm}} = \\frac{s - \\mu}{\\sigma + \\epsilon}", "meaning": "状況を表す数値（$s$）から平均（$\\mu$）を引いてばらつき（$\\sigma$）で割ることで、計算しやすい標準的な大きさに整える式です。"}], "addedDate": "2026-10-24"}, {"paperId": "4530c25da949bb2185c50663158ef19d52e3c6b5", "arxivId": "2206.00927", "title": "DPM-Solver: A Fast ODE Solver for Diffusion Probabilistic Model Sampling in Around 10 Steps", "year": 2022, "published": "2022", "categories": [], "citationCount": 2711, "influentialCitationCount": 274, "url": "https://arxiv.org/abs/2206.00927", "summary": "ノイズから綺麗な画像を少しずつ作り出す拡散モデルは、美しい絵を描ける一方で、1枚の画像を完成させるのに数百回もの計算を繰り返す必要があり、生成に時間がかかる欠点がありました。この生成過程は、数学における「常微分方程式（ODE）」という数式を少しずつ解いていく作業として表現できます。この研究では、拡散モデルの数式を精密に分析し、少ない計算回数でも正確に答えにたどり着ける専用の計算方法（DPM-Solver）を開発しました。この解き方を使うことで、画像の品質を落とすことなく、わずか10回から20回程度の計算ステップで画像を素早く生成できるようになりました。", "terms": {"常微分方程式 (ODE)": "ある量が時間の経過とともにどのように変化していくかを表した数学の方程式です。", "サンプリングステップ": "ノイズまみれの状態から少しずつノイズを引いて綺麗な画像へと仕上げていく、一回ごとの計算手順のことです。", "解析解": "複雑な近似計算を何度も繰り返さなくても、数式変形によって直接導き出せる理論上の正確な答えのことです。", "テイラー展開": "複雑に変化する関数の曲線を、特定の地点での傾きや曲がり具合を使って単純な多項式で近似して計算しやすくする数学の手法です。"}, "formulas": [{"expression": "\\frac{dx_t}{dt} = f(t)x_t + g(t)\\epsilon_\\theta(x_t, t)", "meaning": "時間（$t$）の経過とともに画像（$x_t$）がどのように変化するかを、AIの予測したノイズ（$\\epsilon_\\theta$）を使って表す微分方程式です。"}, {"expression": "x_{t} = e^{\\lambda} x_s + \\int_s^t e^{\\lambda'} h(t') dt'", "meaning": "前の時刻（$s$）の画像データをもとにして、次の時刻（$t$）の画像を厳密な数式によって一気に計算して導き出す式です。"}], "addedDate": "2026-10-24"}, {"paperId": "5c45a5d05ac564adb67811eeb9d41d6460c70135", "arxivId": "", "title": "Development and Validation of a Deep Learning Algorithm for Detection of Diabetic Retinopathy in Retinal Fundus Photographs.", "year": 2016, "published": "2016", "categories": [], "citationCount": 7231, "influentialCitationCount": 271, "url": "https://www.semanticscholar.org/paper/5c45a5d05ac564adb67811eeb9d41d6460c70135", "summary": "糖尿病の合併症である「糖尿病網膜症」は失明の主な原因となりますが、早期に発見して治療すれば防ぐことができます。しかし、目の奥を撮影した写真（眼底写真）を1枚ずつ確認するには多くの眼科専門医が必要で、世界的に人手が足りていません。この研究では、約13万枚の眼底写真に眼科医が診断をつけたデータを用いて、ディープラーニングに病気の兆候を見分ける方法を学習させました。完成したAIを別のテスト用写真で評価したところ、専門医グループと同等の極めて高い精度で病気を正しく発見できることが確認されました。この技術により、専門医が少ない地域でもスクリーニング検査を広く行える可能性が開かれました。", "terms": {"糖尿病網膜症": "糖尿病が原因で目の奥（網膜）の血管が傷つき、視力が低下したり失明に至ったりする病気です。", "眼底写真": "瞳の奥にある網膜や血管の状態を専用のカメラで撮影した写真のことです。", "感度 (Sensitivity)": "実際に病気にかかっている人のうち、AIが正しく「病気である」と見抜くことができた割合です。", "特異度 (Specificity)": "病気にかかっていない健康な人のうち、AIが正しく「異常なし」と判定できた割合です。"}, "formulas": [{"expression": "\\text{Sensitivity} = \\frac{TP}{TP + FN}", "meaning": "実際に病気である人（真陽性 $TP$ ＋ 偽陰性 $FN$）の中で、AIが正しく陽性と診断できた（$TP$）確率を計算する式です。"}, {"expression": "\\text{Specificity} = \\frac{TN}{TN + FP}", "meaning": "病気ではない健康な人（真陰性 $TN$ ＋ 偽陽性 $FP$）の中で、AIが正しく陰性と診断できた（$TN$）確率を計算する式です。"}], "addedDate": "2026-10-24"}, {"paperId": "791b65c65f8ae7e16c1ee9203cdc3ee59ffeb99f", "arxivId": "", "title": "Relation Classification via Convolutional Deep Neural Network", "year": 2014, "published": "2014", "categories": [], "citationCount": 1775, "influentialCitationCount": 249, "url": "https://www.semanticscholar.org/paper/791b65c65f8ae7e16c1ee9203cdc3ee59ffeb99f", "summary": "文章の中から「ある単語」と「別の単語」がどのような関係にあるかをコンピューターに自動判定させるタスクを関係分類と呼びます。例えば「ウイルスが病気を引き起こす」という文から、「原因と結果」という関係性を読み取る作業です。従来は人間が文法規則や重要な手がかりを手作業で細かく指定していましたが、膨大な手間がかかっていました。この研究では、画像認識でよく使われる畳み込みニューラルネットワーク（CNN）を文章の解析に応用しました。単語の意味を表す数値ベクトルに加え、注目する2つの単語からの距離情報（位置特徴量）を一緒にAIへ入力することで、手動ルールに頼らず文脈から関係性を高精度に分類できるようにしました。", "terms": {"関係分類": "文章の中に出てくる2つの言葉（例：「会社」と「創業者」）がどういう関係で結ばれているかを自動判定するタスクです。", "単語埋め込み (Word Embedding)": "単語の意味をコンピューターが計算できるように、数百個の数字が並んだベクトル（数値の列）へと変換する技術です。", "位置特徴量 (Position Features)": "文中の各単語が、関係を調べたい2つの対象単語からどれくらい離れているかの距離を表した情報です。", "プーリング": "ニューラルネットワークの中で、計算された複数の特徴の中から最も重要で強い反応だけを選び出してデータを要約する処理です。"}, "formulas": [{"expression": "z_i = f(W \\cdot x_{i:i+k-1} + b)", "meaning": "文中の連続するいくつかの単語のかたまり（$x$）に重み（$W$）を掛け合わせて足すことで、局所的な意味の特徴（$z_i$）を抽出する畳み込みの計算です。"}, {"expression": "m = \\max(z_1, z_2, \\dots, z_n)", "meaning": "文全体から抽出された様々な特徴値の中から、最も強調されている最大の値を取り出す（マックスプーリング）式です。"}, {"expression": "p(y | x) = \\frac{\\exp(W_y m)}{\\sum_j \\exp(W_j m)}", "meaning": "抽出された文の特徴（$m$）をもとに、どの関係ラベル（$y$）に当てはまるかの確率を計算する式（ソフトマックス関数）です。"}], "addedDate": "2026-10-24"}, {"paperId": "b1e245a304de66f6c6dcc8f5fb2254dab94de7d8", "arxivId": "1904.03582", "title": "Multi-Label Image Recognition With Graph Convolutional Networks", "year": 2019, "published": "2019", "categories": [], "citationCount": 1268, "influentialCitationCount": 231, "url": "https://arxiv.org/abs/1904.03582", "summary": "1枚の写真の中に「犬」「公園」「ボール」のように複数の対象が同時に写っている場合、それぞれの名前をすべて当てるタスクをマルチラベル画像認識と呼びます。現実の物には「海があれば船がある」「コップがあれば机がある」といった、一緒に現れやすい相関関係（共起関係）が存在します。この研究では、物と物のつながりを点と線で表現する「グラフ構造」と、それを処理する「グラフ畳み込みネットワーク（GCN）」を導入しました。各ラベル同士の関連度合いをネットワークで学習し、その知識を画像の特徴と組み合わせることで認識の精度を向上させました。ラベル同士が助け合う関係を組み込むことで、見落としの少ない画像認識を可能にしています。", "terms": {"マルチラベル画像認識": "1枚の画像に対して「猫」と「ソファー」のように、該当する複数の正解タグをすべて予測する画像認識の手法です。", "グラフ畳み込みネットワーク (GCN)": "人間関係のつながりや分子構造のように、点と線で表されるネットワーク状のデータから特徴を学習するディープラーニング技術です。", "共起関係": "ある物と別の物が、同じ場面や同じ写真の中に同時に現れやすい関係性のことです。", "隣接行列": "どの物とどの物がどれくらい強い関係で結ばれているかを、格子状の表（行列）にして表したデータです。"}, "formulas": [{"expression": "H^{(l+1)} = \\sigma(\\hat{A} H^{(l)} W^{(l)})", "meaning": "ラベル同士のつながり具合（$\\hat{A}$）を使って隣り合うラベルの情報を集め、新しい特徴（$H^{(l+1)}$）へと更新するGCNの基本的な計算式です。"}, {"expression": "\\hat{y} = x^T \\cdot w", "meaning": "画像から抽出した特徴（$x$）と、GCNを使って学習したラベルの特徴分類器（$w$）を掛け合わせて、その物が写っているかのスコア（$\\hat{y}$）を出す計算です。"}], "addedDate": "2026-10-24"}, {"paperId": "b79e5e4622a95417deec313cd543617b19611bea", "arxivId": "", "title": "Deep Learning using Rectified Linear Units (ReLU)", "year": 2018, "published": "2018", "categories": [], "citationCount": 4002, "influentialCitationCount": 222, "url": "https://www.semanticscholar.org/paper/b79e5e4622a95417deec313cd543617b19611bea", "summary": "従来のニューラルネットワークでは、シグモイド関数などの活性化関数がよく使われていましたが、ネットワークが深くなると学習が進まなくなる問題がありました。この論文では、入力が正のときはそのまま出力し、負のときはゼロにする「ReLU（正規化線形関数）」の有効性と仕組みについて整理しています。ReLUは計算が非常に単純でありながら、信号が弱まらずに奥の層まで届くという特徴を持っています。実験では、従来の関数に比べて学習速度が大幅に向上し、深いネットワークでも安定して学習できることが確認されました。この結果により、ReLUは多くの深層学習モデルで標準的な活性化関数として利用されるようになりました。", "terms": {"活性化関数": "入力された信号を次の層へ渡す際に、どのような強さで出力するかを決める計算ルールです。", "ReLU（正規化線形関数）": "入力が0以下なら0、0より大きければその数値をそのまま出力する非常にシンプルな関数です。", "勾配消失問題": "ネットワークが深くなるにつれて学習のための修正情報（勾配）が途中で消えてしまい、浅い層の学習が進まなくなる現象です。"}, "formulas": [{"expression": "f(x) = \\max(0, x)", "meaning": "ReLUの計算式であり、入力値 $x$ が負の場合は0を返し、正の場合は $x$ をそのまま出力することを意味します。"}, {"expression": "f'(x) = \\begin{cases} 1 & \\text{if } x > 0 \\\\ 0 & \\text{if } x < 0 \\end{cases}", "meaning": "ReLUの微分（傾き）を表しており、入力が正であれば常に1となるため、学習用の信号が弱まらずに伝わります。"}], "addedDate": "2026-10-24"}, {"paperId": "049fd80f52c0b1fa4d532945d95a24734b62bdf3", "arxivId": "1707.06342", "title": "ThiNet: A Filter Level Pruning Method for Deep Neural Network Compression", "year": 2017, "published": "2017", "categories": [], "citationCount": 1903, "influentialCitationCount": 222, "url": "https://arxiv.org/abs/1707.06342", "summary": "画像認識などで使われる畳み込みニューラルネットワーク（CNN）は高精度ですが、計算量が多くスマートフォンなどの端末では動かしにくいという課題がありました。この研究では、ネットワーク全体を維持したまま、重要度の低いフィルター（画像の特徴を抽出する部品）を丸ごと削る軽量化手法「ThiNet」を提案しています。次の層への出力に与える影響が最も小さいフィルターを数理的に選び出して削除し、ネットワークをスリム化します。特殊な構造変更を行わないため、既存の深層学習ソフトをそのまま使って高速化できます。実験では、認識精度をほとんど落とすことなく、モデルサイズを大幅に削減し計算速度を数倍に引き上げることに成功しました。", "terms": {"CNN（畳み込みニューラルネットワーク）": "画像の中から輪郭や模様などの特徴を捉えるのが得意な、視覚情報向けのAIの仕組みです。", "プルーニング（枝刈り）": "ニューラルネットワークの中から重要度の低い計算部分を削り取り、性能を保ったまま身軽にする技術です。", "フィルター": "画像の上を滑らせて特定の特徴（縦線や特定の色など）を検出するための小さな数値の集まりです。"}, "formulas": [{"expression": "\\arg\\min_S \\sum_{i} \\left( y_i - \\sum_{j \\in S} W_j x_{i,j} \\right)^2", "meaning": "一部のフィルター $S$ だけを残したときに、元の計算結果 $y_i$ とのズレ（誤差）が最も小さくなる組み合わせを選ぶ数式です。"}, {"expression": "|S| = C_{out} \\times r", "meaning": "削った後に残すフィルターの数 $|S|$ を表し、全体の数 $C_{out}$ に対する圧縮率 $r$ に基づいて決定されます。"}], "addedDate": "2026-10-24"}, {"paperId": "246a68fcf2bcd1db8f0184129b63123d1f98eaa3", "arxivId": "2010.16011", "title": "POMO: Policy Optimization with Multiple Optima for Reinforcement Learning", "year": 2020, "published": "2020", "categories": [], "citationCount": 754, "influentialCitationCount": 221, "url": "https://arxiv.org/abs/2010.16011", "summary": "巡回セールスマン問題のように、膨大な選択肢から最適な巡回経路などを見つけ出す「組み合わせ最適化」は、計算に膨大な時間がかかる難問です。強化学習を使って素早く解く研究が進んでいますが、最初に適当なスタート地点を1つ選ぶだけでは、最善とは言えない解に偏ってしまう欠点がありました。そこで本論文では、複数の異なる開始地点から同時に探索を行い、最良の解を選ぶ手法「POMO」を提案しました。1つの問題から複数の解候補を同時に生み出すことで、探索の幅を広げつつ、効率的に優れた方策を学習させます。これにより、追加の計算コストを抑えながら、従来のAI手法よりも高品質な解を極めて短時間で見つけることに成功しました。", "terms": {"組み合わせ最適化問題": "無数の並べ替えや組み合わせの中から、移動距離の合計が最小になるものなど、最善の選択肢を見つけ出す問題です。", "強化学習": "AIが試行錯誤を繰り返し、良い結果（報酬）が得られる行動を自ら学んでいく学習方法です。", "最適解": "すべての選択肢の中で、コストが最も小さいなど最も優れている最良の答えのことです。"}, "formulas": [{"expression": "J(\\theta) = \\mathbb{E}_{s \\sim \\mathcal{S}} \\left[ \\frac{1}{N} \\sum_{i=1}^N R(\\tau_i) \\right]", "meaning": "モデルの学習目標を表す式で、同じ問題に対して $N$ 個の異なる経路 $\\tau_i$ を試し、その平均的な報酬 $R$ を最大化するように学習します。"}, {"expression": "A_i = R(\\tau_i) - \\frac{1}{N} \\sum_{j=1}^N R(\\tau_j)", "meaning": "ある経路 $i$ の良さ（アドバンテージ）を計算する式で、その経路のスコアから全 $N$ 個の解の平均スコアを引くことで求めています。"}], "addedDate": "2026-10-24"}, {"paperId": "a92b103b81a48878e76f1fcfc3e2a1454f895555", "arxivId": "", "title": "Neural networks and Deep Learning", "year": 2016, "published": "2016", "categories": [], "citationCount": 2794, "influentialCitationCount": 220, "url": "https://www.semanticscholar.org/paper/a92b103b81a48878e76f1fcfc3e2a1454f895555", "summary": "ニューラルネットワークは単純な計算モデルから始まり、現代の深層学習へと大きく発展を遂げてきました。この論文は、ニューラルネットワークがどのような歴史的背景を経て発展し、どのような構造が作られてきたかを体系的に整理した総合解説です。画像のように空間的な並びを持つデータにはCNN、文章や音声のように時間の流れを持つデータにはRNNなど、扱うデータに応じたモデルの使い分けを説明しています。また、画像認識、音声処理、医療診断など、実社会の様々な領域での応用事例を紹介しています。深層学習の全体像を捉え、問題ごとに適切な仕組みを選ぶための道標となる内容を提示しています。", "terms": {"深層学習（ディープラーニング）": "何層もの計算層を積み重ねたニューラルネットワークを使い、データから自動で複雑な特徴を捉える技術です。", "アーキテクチャ": "ニューラルネットワークの部品の配置や層のつなぎ方など、モデル全体の構造・設計のことです。", "RNN（再帰型ニューラルネットワーク）": "過去の情報を記憶しながら処理できる構造を持ち、文章や音声など順番が大切なデータを扱うのに向いたAIです。"}, "formulas": [{"expression": "y = f\\left( \\sum_{i=1}^{n} w_i x_i + b \\right)", "meaning": "単一の神経細胞（ニューロン）の基本計算式で、入力 $x_i$ に重要度（重み $w_i$）を掛けて足し合わせ、バイアス $b$ を加えた後に活性化関数 $f$ を通すことを示します。"}, {"expression": "L = \\frac{1}{N} \\sum_{k=1}^N (y_k - \\hat{y}_k)^2", "meaning": "AIの予測値 $\\hat{y}_k$ と実際の正解 $y_k$ とのズレを測る平均二乗誤差であり、この値が小さくなるように学習を進めます。"}], "addedDate": "2026-10-24"}, {"paperId": "d6a083dad7114f3a39adc65c09bfbb6cf3fee9ea", "arxivId": "1906.02243", "title": "Energy and Policy Considerations for Deep Learning in NLP", "year": 2019, "published": "2019", "categories": [], "citationCount": 3819, "influentialCitationCount": 189, "url": "https://arxiv.org/abs/1906.02243", "summary": "自然言語処理（NLP）の分野では、モデルを巨大化して大量のデータで学習させることで性能を伸ばす手法が主流になっています。しかし、この学習には高性能な計算機を何千時間も動かす必要があり、莫大な電力消費を伴います。本論文は、代表的な言語モデルを学習させる際にかかる金銭的コストと、二酸化炭素（CO2）の排出量を実際に計測・試算して警鐘を鳴らした研究です。試算の結果、1つの大規模モデルの学習で、乗用車数台が一生の間に排出するCO2と同等以上の負荷がかかることが判明しました。著者らは、AI開発において単に正解率だけでなく、環境負荷や計算効率も同時に評価・報告すべきだと提唱しています。", "terms": {"自然言語処理（NLP）": "人間が普段話したり書いたりする言葉（テキスト）を、コンピュータに理解・処理させるAIの分野です。", "カーボンフットプリント": "製品の製造やサービスの提供、AIの計算などによって排出される温室効果ガスの総量のことです。", "パラメータ数": "AIの頭脳の大きさに相当する数値の数で、これが大きいほど賢くなりやすい反面、計算や電力の消費が増加します。"}, "formulas": [{"expression": "p_t = \\frac{1.45 \\times (p_{cpu} + p_{gpu} + p_{dram})}{1000}", "meaning": "計算機全体が消費する総電力（キロワット）を見積もる式で、CPUやGPUの電力に冷却等の設備電力（係数1.45）を加味して計算します。"}, {"expression": "\\text{CO}_2\\text{e} = E \\times c", "meaning": "消費した総電力量 $E$ に、地域の発電方法に応じた排出係数 $c$ を掛けることで、排出された二酸化炭素相当量（$\\text{CO}_2\\text{e}$）を算出する式です。"}], "addedDate": "2026-10-24"}, {"paperId": "4625628163a2ee0e6cd320cd7a14b4ccded2a631", "arxivId": "1903.08254", "title": "Efficient Off-Policy Meta-Reinforcement Learning via Probabilistic Context Variables", "year": 2019, "published": "2019", "categories": [], "citationCount": 882, "influentialCitationCount": 179, "url": "https://arxiv.org/abs/1903.08254", "summary": "深層強化学習は1つのタスクを覚えるだけでも膨大な試行錯誤を必要とし、新しい状況に素早く適応することが苦手でした。新しいタスクへ即座に適応するメタ強化学習という手法もありますが、過去のデータを再利用できず、学習効率が低いという課題を抱えていました。本研究では、タスクごとの特徴や不確実性を小さな確率変数（文脈情報）として推定する手法「PEARL」を提案しました。これにより、過去に収集した膨大な試行データを捨てずに効率よく再利用できるようになります。その結果、従来の手法と比べて約20〜100倍も少ないデータ量で、新しいタスクに素早く適応できるようになりました。", "terms": {"メタ強化学習": "「新しいスキルを素早く学ぶ方法そのもの」をAIに学習させ、未知のタスクに即座に対応できるようにする技術です。", "オフポリシー学習": "自分が今行っている行動だけでなく、過去の行動ログや他人の行動データなども再利用して学習する効率的な方法です。", "潜在変数": "直接目には見えないけれど、状況の違いや課題の背後にある特徴を表している隠れた数値のことです。"}, "formulas": [{"expression": "q_\\phi(z|c)", "meaning": "わずかな経験データ $c$ から、現在のタスクがどのような特徴 $z$ を持っているかを推測する確率分布を表しています。"}, {"expression": "\\mathcal{L}_{meta} = \\mathbb{E}_{\\mathcal{T}} \\left[ \\mathbb{E}_{z \\sim q_\\phi} \\left[ \\mathcal{L}_{RL}(\\mathcal{T}, z) \\right] + \\beta D_{KL}(q_\\phi(z|c) \\parallel p(z)) \\right]", "meaning": "タスクの報酬を高めつつ、タスク特徴の推測が不自然に偏らないように調整するための全体の損失関数です。"}], "addedDate": "2026-10-24"}, {"paperId": "d8c78221e4366d6a72a6b3e41e35b706cc45c01d", "arxivId": "2305.13301", "title": "Training Diffusion Models with Reinforcement Learning", "year": 2023, "published": "2023", "categories": [], "citationCount": 1167, "influentialCitationCount": 178, "url": "https://arxiv.org/abs/2305.13301", "summary": "画像生成などで注目される拡散モデルは、「元のデータにどれだけ似ているか」という統計的な基準で学習されています。しかし実際の利用場面では、人間が見て美しいと感じるかや、創薬における薬効など、目的に直結した指標で生成物を評価したいという要望があります。そこで本研究では、拡散モデルを強化学習と組み合わせ、望ましい性質を直接最大化するように訓練する手法を開発しました。徐々にノイズを取り除いていく画像生成の流れを、多段階の意思決定プロセスと捉えることで、強化学習の枠組みを適用可能にしています。これにより、人間の好みのスコアや特定の物理的目標に合わせた、より質の高い画像やデータを生成できるようになりました。", "terms": {"拡散モデル": "画像に少しずつノイズを加えていき、逆にそのノイズを少しずつ取り除く計算を学ぶことで、新しい画像を生成する技術です。", "デノイジング（ノイズ除去）": "砂嵐のようなノイズだらけの画像から、不要なノイズを少しずつ差し引いて鮮明な画像へ戻す処理のことです。", "報酬関数": "生成されたものが目的に合致しているか（画質が良いかなど）を点数化し、AIに与える評価基準のことです。"}, "formulas": [{"expression": "\\max_\\theta \\mathbb{E}_{x_0 \\sim p_\\theta} [R(x_0)]", "meaning": "モデル $p_\\theta$ によって生成された最終的な画像 $x_0$ が得る報酬スコア $R(x_0)$ の平均値を、最大にするように調整することを目指す式です。"}, {"expression": "\\nabla_\\theta J(\\theta) = \\mathbb{E} \\left[ \\sum_{t=1}^T \\nabla_\\theta \\log p_\\theta(x_{t-1}|x_t) \\cdot Q(x_t, x_{t-1}) \\right]", "meaning": "ノイズ除去の各ステップにおける行動の確率を高めるために、将来得られる見込み報酬 $Q$ に基づいてパラメータを更新する計算式です。"}], "addedDate": "2026-10-24"}, {"paperId": "1eac5d12f30697aa74d66f4026fb662c5d51bd43", "arxivId": "2401.08740", "title": "SiT: Exploring Flow and Diffusion-based Generative Models with Scalable Interpolant Transformers", "year": 2024, "published": "2024", "categories": [], "citationCount": 831, "influentialCitationCount": 173, "url": "https://arxiv.org/abs/2401.08740", "summary": "高品質な画像を生成する技術として、拡散モデルと並んで「フロー（流れ）モデル」が注目されています。本論文では、両者の手法を包括的かつ柔軟につなぐ枠組み「SiT」を提案し、その効果を検証しました。SiTは画像処理で実績のあるTransformer構造をベースにし、ノイズから画像へ変化する軌跡を数理的な「補間」として統一的に扱います。時間の進め方や目標とする誤差の測り方など、モデル設計の各要素を切り分けて実験できる環境を整えました。その結果、従来の拡散モデルよりも学習が速く、より少ない計算ステップで高品質な画像を生成できることを示しました。", "terms": {"Transformer": "データ内の離れた要素同士の関連性を同時に把握できる、現代のAIで広く使われている計算の骨組みです。", "補間（Interpolant）": "2つの状態（例えば完全なノイズ画像と本物の写真）の間を、滑らかな直線や曲線でつなぐ道筋のことです。", "フローマッチング": "ランダムな点から目的の画像へ向かう「データの動く速度や向き（流れ）」をAIに直接学習させる手法です。"}, "formulas": [{"expression": "I_t(x_0, x_1) = a_t x_0 + b_t x_1", "meaning": "時間 $t$ に応じてノイズ $x_0$ と目的の画像 $x_1$ を重み付けして混ぜ合わせ、途中の状態を作り出す補間の式です。"}, {"expression": "v_t(x) = \\frac{d}{dt} I_t", "meaning": "ノイズが画像へと変化していく途中の各瞬間における、データの移動速度や方向（速度ベクトル）を表す式です。"}], "addedDate": "2026-10-24"}, {"paperId": "65c47c35495f472bad1c088dfd1e15c304786634", "arxivId": "", "title": "Cardiologist-Level Arrhythmia Detection and Classification in Ambulatory Electrocardiograms Using a Deep Neural Network", "year": 2019, "published": "2019", "categories": [], "citationCount": 3039, "influentialCitationCount": 170, "url": "https://www.semanticscholar.org/paper/65c47c35495f472bad1c088dfd1e15c304786634", "summary": "小型の心電計を身につけて日常生活中の心拍を記録するホルター心電図検査は、不整脈の発見に有効ですが、膨大な波形データを医師が目で見て確認するには大きな負担がかかります。この研究では、深層畳み込みニューラルネットワーク（CNN）を用いて、心電図の波形から多様な不整脈を自動で検出・分類するシステムを開発しました。数万人規模の患者から得た心電図データを使って、34層の深いネットワークを学習させています。評価実験において、開発したAIは12種類の不整脈を専門の心臓病専門医と同等以上の正確さで識別できることが示されました。この成果により、専門医が不足している地域での診断支援や、迅速な医療対応への活用が期待されます。", "terms": {"心電図（ECG）": "心臓が拍動する際に発生する微弱な電気信号を波形として記録したものです。", "不整脈": "心臓の鼓動のリズムが乱れ、通常よりも脈が速くなったり遅くなったりする病態です。", "ResNet（残差ネットワーク）": "層を深くしても学習が失敗しないよう、途中の入力を迂回させて足し合わせる工夫（スキップ接続）を取り入れたネットワークです。"}, "formulas": [{"expression": "\\mathcal{L}_{CE} = -\\sum_{c=1}^{C} y_c \\log(\\hat{y}_c)", "meaning": "AIが予測した各不整脈の確率 $\\hat{y}_c$ と実際の正解ラベル $y_c$ を比較し、予測のズレを測るクロスエントロピー損失関数です。"}, {"expression": "y = \\mathcal{F}(x, \\{W_i\\}) + x", "meaning": "ResNetの基本構造を示しており、入力 $x$ を畳み込み計算 $\\mathcal{F}$ に通したものに元の $x$ をそのまま足すことで、信号の消失を防ぎます。"}], "addedDate": "2026-10-24"}, {"paperId": "19df654b0d0f634a451564346a09af8bd348dac0", "arxivId": "2505.13447", "title": "Mean Flows for One-step Generative Modeling", "year": 2025, "published": "2025", "categories": [], "citationCount": 685, "influentialCitationCount": 169, "url": "https://arxiv.org/abs/2505.13447", "summary": "従来の画像生成モデルは、ノイズを少しずつ何度も取り除くため、1枚の画像を作るのに数十回の計算が必要で時間がかかっていました。この問題を解決するため、本論文ではたった1回の計算（1ステップ）で高品質な画像を生成する新手法「MeanFlow」を提案しています。これまでの手法が「その瞬間の速度」を予測していたのに対し、MeanFlowはノイズから最終画像までの「全体の平均速度」を直接予測する点に特徴があります。事前学習や他のモデルからの知識のコピー（蒸留）を必要とせず、単独でゼロから訓練することができます。実験では、わずか1回のステップ計算でありながら、既存の複雑な手法に匹敵する極めて鮮明な画像を瞬時に生成できることを示しました。", "terms": {"1ステップ生成": "何度も段階を踏むのではなく、たった1回の計算処理でノイズから完成した画像を瞬時に作り出す技術です。", "平均速度（Mean Velocity）": "ノイズという出発点から完成画像という到着点まで、途中で立ち止まらずに一気に進むための全体の平均的な速さと向きのことです。", "蒸留（Distillation）": "時間をかけて画像を生成する大型モデルの知識を、計算が速い軽量モデルへと教え込んでコピーする手法です。"}, "formulas": [{"expression": "u(x_0, x_1) = x_1 - x_0", "meaning": "初期のノイズ $x_0$ から目標画像 $x_1$ への全体を通した移動ベクトル（平均的な速度）を表す式です。"}, {"expression": "x_1 = x_0 + u_\\theta(x_0)", "meaning": "ノイズ $x_0$ に対し、モデルが予測した平均移動方向 $u_\\theta(x_0)$ を足し合わせるだけで、1回で完成画像 $x_1$ を生成する計算式です。"}], "addedDate": "2026-10-24"}];
